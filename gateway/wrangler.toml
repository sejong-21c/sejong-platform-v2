# 세종 AI 게이트웨이 — wrangler 배포 설정 (2026-07-27부터 CLI 배포 병행)
# 배포: cd gateway && npx wrangler deploy
# 주의: keep_vars=true 필수 — 대시보드에서 넣은 일반 변수(ALLOWED_ORIGINS, NINEROUTER_* 등)를
#       배포가 지우지 않게 한다. Secret(GEMINI_KEYS, FIREBASE_SA_KEY 등)은 원래 유지됨.
name = "sejong-ai-gateway"
main = "cloudflare-worker.js"
compatibility_date = "2026-07-01"
keep_vars = true

# 사내문서 검색을 맥미니(파이스)로 넘긴다 — 2026-09-19.
# 왜: Vectorize 무료는 1024차원 약 4,880조각까지다. ASME 서술형 8권만 약 1만 조각이라
# Workers Paid($5/월)가 필요했는데, 맥에 bge-m3 와 터널이 이미 있어 0원에 조각 수 상한도 없다.
# 맥이 꺼져 있으면 워커가 아래 Vectorize 로 물러선다(사내문서 검색이 통째로 죽지 않게).
# PAIS_TOKEN 은 Secret: npx wrangler secret put PAIS_TOKEN
#   ⚠️ 파이스 마스터 토큰(accessToken)이 아니라 **검색 전용 토큰(settings.ragToken)** 을 넣는다.
#   마스터를 넣으면 워커가 파이스의 도구 실행·볼트·메일까지 할 수 있게 된다.
[vars]
PAIS_URL = "https://pais.sejong21c.com"

# Workers AI — RAG 임베딩(bge-m3)용
[ai]
binding = "AI"

# Vectorize — 사내 문서 벡터 인덱스
[[vectorize]]
binding = "VECTORIZE"
index_name = "sejong-docs"

# 능동 알림 + 야간 백업 크론 (UTC 00:00 = 한국 09:00)
[triggers]
crons = ["0 0 * * *"]

# 파일 저장소 — ASME 코드북 그림 · 메신저 사진 · 영수증. 2026-09-18 R2 활성화하고 만들었다(apac).
# 꺼내 쓰는 길은 cloudflare-worker.js 의 /file/* — 서명된 주소라야 내준다(img 태그가 토큰을 못 실어서).
[[r2_buckets]]
binding = "FILES"
bucket_name = "sejong-files"

# Firestore 야간 백업 — **껐다(2026-09-19)**. 버킷 sejong-backup 은 만들어져 있다.
# 끈 이유: 파이어베이스가 무료(Spark) 요금제라 **하루 문서 읽기 5만 건** 제한이 있는데,
# 전 컬렉션 백업은 첨부 조각까지 전부 읽어서 한 번에 그 한도를 다 태운다. 실제로 첫 실행에서
# 태웠고 그 뒤 플랫폼이 429(Quota exceeded)로 읽기를 못 했다. 매일 아침 9시에 이걸 반복하면
# 매일 아침 회사 플랫폼이 멈춘다. 다시 켜기 전에 아래 중 하나를 먼저 해야 한다:
#   ① Firestore 를 Blaze 로 올린다(읽기 10만 건당 $0.06 — 백업 한 번에 몇백 원)
#   ② 백업 대상을 중요한 작은 컬렉션으로 좁히고 컬렉션당 쪽수 상한을 둔다(파이스 방식)
# [[r2_buckets]]
# binding = "BACKUP"
# bucket_name = "sejong-backup"
