# 세종 AI 게이트웨이 — wrangler 배포 설정 (2026-07-27부터 CLI 배포 병행)
# 배포: cd gateway && npx wrangler deploy
# 주의: keep_vars=true 필수 — 대시보드에서 넣은 일반 변수(ALLOWED_ORIGINS, NINEROUTER_* 등)를
#       배포가 지우지 않게 한다. Secret(GEMINI_KEYS, FIREBASE_SA_KEY 등)은 원래 유지됨.
name = "sejong-ai-gateway"
main = "cloudflare-worker.js"
compatibility_date = "2026-07-01"
keep_vars = true

# 사내문서 검색을 맥미니(파이스)로 넘긴다 — 2026-09-19.
# 왜: Vectorize 무료는 1024차원 약 4,880조각까지다. ASME 서술형 8권만 약 1만 조각이라
# Workers Paid($5/월)가 필요했는데, 맥에 bge-m3 와 터널이 이미 있어 0원에 조각 수 상한도 없다.
# 맥이 꺼져 있으면 워커가 아래 Vectorize 로 물러선다(사내문서 검색이 통째로 죽지 않게).
# PAIS_TOKEN 은 Secret: npx wrangler secret put PAIS_TOKEN
#   ⚠️ 파이스 마스터 토큰(accessToken)이 아니라 **검색 전용 토큰(settings.ragToken)** 을 넣는다.
#   마스터를 넣으면 워커가 파이스의 도구 실행·볼트·메일까지 할 수 있게 된다.
[vars]
PAIS_URL = "https://pais.sejong21c.com"
# 백업 울타리 두 개(관문 v4.3). 아래 [[r2_buckets]] BACKUP 주석에 고른 근거가 있다.
BACKUP_SKIP_OVER = "12000"     # 한 컬렉션이 이보다 크면 읽지 않고 건너뛴다(이유는 보고에 남는다)
BACKUP_READ_BUDGET = "20000"   # 하루 읽기 예산. 넘으면 넘는 컬렉션부터 내일로 미룬다

# Workers AI — RAG 임베딩(bge-m3)용
[ai]
binding = "AI"

# Vectorize — 사내 문서 벡터 인덱스
[[vectorize]]
binding = "VECTORIZE"
index_name = "sejong-docs"

# 능동 알림 + 야간 백업 크론 (UTC 00:00 = 한국 09:00)
[triggers]
crons = ["0 0 * * *"]

# 2026-09-24: 첫 자동 백업이 흔적 없이 사라져서 켰다 — console.error 가 대시보드(Workers 로그)에 남는다
[observability]
enabled = true

# 파일 저장소 — ASME 코드북 그림 · 메신저 사진 · 영수증. 2026-09-18 R2 활성화하고 만들었다(apac).
# 꺼내 쓰는 길은 cloudflare-worker.js 의 /file/* — 서명된 주소라야 내준다(img 태그가 토큰을 못 실어서).
[[r2_buckets]]
binding = "FILES"
bucket_name = "sejong-files"

# Firestore 야간 백업 — 2026-09-19 에 껐다가 **2026-09-24 에 다시 켰다.**
#
# 왜 껐었나: 무료(Spark)는 하루 문서 읽기 5만 건인데 전 컬렉션 백업이 첨부 조각까지 전부 읽어
#   한 번에 그 한도를 다 태웠다. 그 뒤 플랫폼이 종일 429 였다. 매일 아침 9시에 반복하면
#   매일 아침 회사 플랫폼이 멈춘다. 그래서 껐고, 다시 켜는 조건을 여기 적어 두었다:
#     ① Blaze 로 올린다  ② 대상을 좁히고 상한을 둔다(파이스 방식)
#
# **②를 했다(관문 v4.3).** 컬렉션마다 집계로 **먼저 세고**(1,000건당 읽기 1건 — 거의 공짜),
#   상한을 넘으면 읽지 않고 건너뛰며 이유를 보고에 남긴다. 하루 읽기 예산도 따로 있다.
#   그리고 그 사이 chunk__·dwg_ 조각이 R2 로 이관돼 DB 에서 사라졌다.
#
# 2026-09-24 실측으로 고른 값: **DB 전체가 15,310건**이다(제일 큰 게 activityLog 9,969 · messages 3,569).
#   SKIP_OVER 12,000 이면 지금은 **아무것도 안 건너뛰고** 전부 받는다 = 하루 15,310 읽기(한도의 31%).
#   READ_BUDGET 20,000 은 그 위의 안전선이다 — 컬렉션이 자라 예산을 넘으면 넘는 것부터 내일로 미룬다.
#   한 컬렉션이 12,000 을 넘으면 건너뛰고 **보고에 남긴다**(조용히 빠지지 않는다).
#   지금 회사 자료의 사본은 여기뿐이다 — 하루 31% 는 그 값으로 싸다.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "sejong-backup"
