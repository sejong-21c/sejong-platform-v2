<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교반기 선정·설계 (agitcalc)</title>
<!-- 단독 실행판 — 외부 CDN·서버·로그인 의존성 없음. 파일을 더블클릭하면 열립니다.
     계산 엔진은 ./agitcalc-core.js (파이썬 패키지 agitcalc 의 1:1 포팅). -->
<script src="./agitcalc-core.js"></script>
<style>
:root {
  --primary:#1976D2; --primary-hover:#1565C0; --primary-light:#E3F2FD;
  --primary-lighter:#F0F7FF; --success:#4CAF50; --warning:#FF9800; --danger:#F44336;
  --bg:#F5F7FA; --white:#fff; --border:#E0E0E0; --border-light:#F0F0F0;
  --text:#333; --text-light:#666; --text-lighter:#999; --radius:8px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px}
.head{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px}
.head h1{font-size:18px;margin:0}
.head .sub{color:var(--text-light);font-size:12px;margin-top:3px}
.tabs{display:flex;gap:2px;background:var(--white);border-bottom:1px solid var(--border);
  padding:0 24px;position:sticky;top:0;z-index:10}
.tab{padding:10px 16px;cursor:pointer;border:0;background:none;font-size:13px;
  color:var(--text-light);border-bottom:2px solid transparent;font-family:inherit}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
#app{padding:20px 24px 80px;max-width:1500px;margin:0 auto}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700}
.grid2{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.sec-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.sec-split{grid-template-columns:1fr}}
.fg{margin-bottom:11px}
.fl{display:block;font-size:12px;color:var(--text-light);margin-bottom:4px;font-weight:600}
.fi,.fs{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:5px;
  font-size:13px;font-family:inherit;background:var(--white)}
.fi:focus,.fs:focus{outline:none;border-color:var(--primary)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:5px;background:var(--white);
  cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{background:var(--border-light)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--primary-hover)}
.btn-lg{padding:11px 18px;font-size:14px;width:100%}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:var(--danger);border-color:#f8c9c6}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--primary-lighter);border:1px solid var(--primary-light);border-radius:6px;padding:10px 12px}
.kpi-label{font-size:11px;color:var(--text-light);margin-bottom:3px}
.kpi-value{font-size:17px;font-weight:700;color:var(--primary);line-height:1.2}
.kpi-unit{font-size:11px;font-weight:400;color:var(--text-light)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:6px 9px;border-bottom:1px solid var(--border-light);text-align:left}
table.t th{background:var(--bg);font-weight:600;color:var(--text-light);font-size:11.5px}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.b-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.b-pill.green{background:#E8F5E9;color:#2E7D32}
.b-pill.red{background:#FFEBEE;color:#C62828}
.b-pill.orange{background:#FFF3E0;color:#E65100}
.b-pill.gray{background:#F5F5F5;color:#616161}
.chk{padding:7px 10px;border-radius:5px;margin-bottom:5px;font-size:12.5px}
.chk.ok{background:#F1F8F2;color:#2E7D32}
.chk.ng{background:#FFF5F5;color:#C62828}
.warn{background:#FFF8E1;border-left:3px solid var(--warning);padding:9px 12px;
  margin-bottom:7px;font-size:12.5px;border-radius:0 5px 5px 0;line-height:1.6}
/* 계산서 — 웹 화면과 같은 밝은 표. 인쇄/PDF 에서도 그대로 읽힌다. */
.rpt{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px}
.rpt-h{background:var(--primary-lighter);border-bottom:1px solid var(--primary-light);
  padding:9px 12px;font-weight:700;font-size:13px}
.rpt-h .ref{font-weight:400;font-size:11.5px;color:var(--text-light);margin-top:2px}
.rpt-sec{font-size:11.5px;font-weight:700;color:var(--text-light);background:var(--bg);
  padding:5px 12px;border-top:1px solid var(--border-light)}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
table.rt td{padding:5px 12px;border-bottom:1px solid var(--border-light);vertical-align:top}
table.rt td.k{width:44%;color:var(--text)}
table.rt td.v{width:22%;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table.rt td.u{width:10%;color:var(--text-light);font-size:11.5px}
table.rt td.f{color:var(--text-lighter);font-size:11px;font-family:Consolas,"D2Coding",monospace}
pre.sheet{background:var(--white);border:1px solid var(--border);color:var(--text);padding:14px;
  border-radius:6px;font-size:11.5px;line-height:1.55;overflow-x:auto;
  font-family:Consolas,"D2Coding",monospace;margin:0}
.hint{font-size:11.5px;color:var(--text-lighter);margin-top:3px;line-height:1.5}
.disclaimer{background:#FFF8E1;border:1px solid #FFE082;border-radius:6px;padding:11px 14px;
  font-size:12px;color:#7a5c00;margin-bottom:16px;line-height:1.6}
svg.tankdraw{width:100%;height:auto;background:#FCFDFF;border:1px solid var(--border-light);border-radius:6px}
.empty{text-align:center;color:var(--text-lighter);padding:50px 20px;font-size:13px}
code{background:var(--bg);padding:1px 4px;border-radius:3px;font-size:12px}
/* 인쇄 = PDF 저장 경로 (브라우저 기본 기능, 별도 라이브러리 없음) */
@media print{
  .tabs,.head,.btn,.noprint{display:none!important}
  body{background:#fff;font-size:11px}
  #app{padding:0;max-width:none}
  .card,.rpt{border-color:#999;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .rpt{margin-bottom:10px}
  .rpt-h{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rpt-sec{background:#f7f7f7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .kpi{background:#f4f8fd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chk.ok,.chk.ng,.warn,.b-pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  svg.tankdraw{break-inside:avoid;page-break-inside:avoid;max-height:150mm}
  .print-head{display:block!important;margin-bottom:10px;border-bottom:2px solid #333;padding-bottom:6px}
}
.print-head{display:none}
@page{size:A4;margin:14mm}
</style>
</head>
<body>
<div class="head">
  <h1>🌀 교반기 선정·설계 <span style="font-size:12px;font-weight:400;color:#999">agitcalc v0.1 · 단독 실행판</span></h1>
  <div class="sub">점도·비중·탱크 제원 입력 → 임펠러 형식·치수·회전수·동력·모터·축 산출 · 협력업체 검토서 대조</div>
</div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>

<script>
"use strict";
/* =====================================================================
   단독 실행판 — Firebase 없음. 저장은 브라우저 localStorage 에만 한다.
   플랫폼판(modules/agitator/agitator.html)과 계산 엔진은 완전히 동일하다.
   ===================================================================== */
const LS_KEY = 'AGITCALC_STANDALONE_V01';
let designs = [];
let view = { tab: 'design', result: null, error: null };

/* 길이 입력은 전부 mm (제작 도면 기준). 엔진에 넘길 때만 m 로 환산한다. */
const DEFAULTS = {
  customer:'', project:'', item:'',
  T:4500, V:50, rho:1300, mu:15000,
  impellerType:'', dT:'', nImp:'',
  basis:'level', level:'moderate', rpm:'', blendMin:'',
  material:'SUS304', mechEff:0.95, motorMargin:1.15, maxLoad:0.90,
  shaftExtra:600, serviceFactor:1.5, baffled:'', dataset:'LIT', vfdMin:0.3
};
let form = Object.assign({}, DEFAULTS);

const LEVEL_LABEL = {
  mild:'완만 (20~100 W/m³) — 액위 균일화',
  moderate:'보통 (100~300 W/m³) — 일반 혼합·열전달',
  vigorous:'강 (300~800 W/m³) — 고체현탁·반응',
  intense:'격렬 (800~2000 W/m³) — 유화·결정화'
};

/* --- 예제 프리셋: 실제 D&K켐텍 검토서 조건 --- */
const PRESETS = [
  {label:'FA-6101  50m³ RESOL A (15,000cP)', v:{customer:'D&K켐텍',project:'SJ426-24',item:'FA-6101',T:4500,V:50,rho:1300,mu:15000}},
  {label:'FA-6102  50m³ 경화제1 (2,000cP)',  v:{customer:'D&K켐텍',project:'SJ426-24',item:'FA-6102',T:4500,V:50,rho:1300,mu:2000}},
  {label:'FA-6104   3m³ 정포제 (1,000cP)',   v:{customer:'D&K켐텍',project:'SJ426-24',item:'FA-6104',T:1500,V:3,rho:1110,mu:1000}},
  {label:'FA-6201 12.5m³ MIXING (15,000cP)', v:{customer:'D&K켐텍',project:'SJ426-24',item:'FA-6201',T:2350,V:12.5,rho:1100,mu:15000}},
  {label:'FA-6205   2m³ 중화제 (7,000cP)',   v:{customer:'D&K켐텍',project:'SJ426-24',item:'FA-6205',T:1300,V:2,rho:1691,mu:7000}},
  {label:'FA-6302   2m³ 난연제 (8,000cP)',   v:{customer:'D&K켐텍',project:'SJ426-24',item:'FA-6302',T:1300,V:2,rho:1300,mu:8000}}
];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function n2(x,d){return (x==null||!isFinite(x))?'—':Number(x).toFixed(d==null?2:d);}
function nowISO(){return new Date().toISOString();}
function uid(){return 'ag-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function loadLS(){try{designs=JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){designs=[];}
  if(!Array.isArray(designs))designs=[];}
function saveLS(){try{localStorage.setItem(LS_KEY,JSON.stringify(designs));}catch(e){}}

/* ---------------- 계산 ---------------- */
function runDesign(){
  view.error=null;
  const f=form, num=v=>(v===''||v==null)?null:Number(v);
  const mm=v=>{const x=num(v); return x==null?null:x/1000;};   // mm 입력 -> m
  try{
    const o={
      V:Number(f.V), rho:Number(f.rho), mu_cP:Number(f.mu), T:mm(f.T),
      basis:f.basis, level:f.level, impellerType:f.impellerType||null,
      dT:num(f.dT), nImp:num(f.nImp), rpm:num(f.rpm), targetBlendMin:num(f.blendMin),
      material:f.material, mechEff:Number(f.mechEff), motorMargin:Number(f.motorMargin),
      maxLoad:Number(f.maxLoad), shaftExtraMM:Number(f.shaftExtra),
      serviceFactor:Number(f.serviceFactor), vfdMinRpmRatio:Number(f.vfdMin),
      dataset:f.dataset, baffled:f.baffled===''?null:(f.baffled==='yes')
    };
    if(!(o.V>0)) throw new Error('액체 체적 V 를 입력하세요');
    if(!(o.rho>0)) throw new Error('비중(밀도) 을 입력하세요');
    if(!(o.mu_cP>0)) throw new Error('점도 를 입력하세요');
    view.result=agitcalc.design(o);
  }catch(e){view.error=e.message||String(e);view.result=null;}
  render();
}

/* ---------------- 탱크 단면도 ---------------- */
function drawTank(res){
  // mT 는 구동부 박스(yTop-62)와 T 치수선(yTop-18)이 들어갈 만큼 확보해야 한다.
  // 탱크가 높아 yTop 이 mT 까지 올라가면 mT<62 에서 구동부가 캔버스 밖으로 나간다.
  const g=res.geometry, W=620, Hpx=490, mL=96, mR=150, mT=78, mB=46;
  const drawW=W-mL-mR, drawH=Hpx-mT-mB;
  const tankH=g.H*1.2, sc=Math.min(drawW/g.T, drawH/tankH);
  const tw=g.T*sc, th=tankH*sc, cx=mL+drawW/2;
  const yTop=mT+(drawH-th), yBot=yTop+th, xL=cx-tw/2, xR=cx+tw/2;
  const yLiq=yBot-g.H*sc, dishR=tw*0.25, P=[];

  P.push(`<path d="M ${xL} ${yTop} L ${xL} ${yBot-dishR} Q ${xL} ${yBot} ${cx} ${yBot}
    Q ${xR} ${yBot} ${xR} ${yBot-dishR} L ${xR} ${yTop}" fill="#fff" stroke="#37474F" stroke-width="2.5"/>`);
  P.push(`<path d="M ${xL} ${yLiq} L ${xL} ${yBot-dishR} Q ${xL} ${yBot} ${cx} ${yBot}
    Q ${xR} ${yBot} ${xR} ${yBot-dishR} L ${xR} ${yLiq} Z" fill="#BBDEFB" fill-opacity="0.55"/>`);
  P.push(`<line x1="${xL}" y1="${yLiq}" x2="${xR}" y2="${yLiq}" stroke="#1976D2" stroke-width="1.6" stroke-dasharray="7 4"/>`);

  if(g.baffled){
    const bw=g.B*sc, bg=g.B_wall_clearance*sc;
    [-1,1].forEach(s=>{
      const x = s<0 ? xL+bg : xR-bg-bw;
      P.push(`<rect x="${x}" y="${yLiq+4}" width="${Math.max(bw,2.5)}" height="${(yBot-dishR)-yLiq-6}"
        fill="#90A4AE" stroke="#546E7A" stroke-width="0.8"/>`);
    });
  }
  const shaftW=Math.max(res.shaft_dia_mm/1000*sc,4);
  P.push(`<rect x="${cx-shaftW/2}" y="${yTop-30}" width="${shaftW}"
    height="${(yBot-g.elevations[0]*sc)-(yTop-30)+6}" fill="#78909C" stroke="#455A64" stroke-width="1"/>`);
  P.push(`<rect x="${cx-34}" y="${yTop-62}" width="68" height="32" rx="4" fill="#455A64"/>`);
  P.push(`<text x="${cx}" y="${yTop-42}" font-size="11" fill="#fff" text-anchor="middle" font-family="sans-serif">${n2(res.motor_kW,1)} kW</text>`);
  P.push(`<rect x="${cx-30}" y="${yTop-8}" width="60" height="8" fill="#607D8B"/>`);

  const dw=g.D*sc;
  g.elevations.forEach(e=>{
    const y=yBot-e*sc, t=g.impeller_type;
    if(t==='MAXBLEND'){
      const lp=(g.lower_paddle_H||g.H*0.35)*sc, gr=(g.grid_H||g.H*0.5)*sc;
      P.push(`<rect x="${cx-dw/2}" y="${y-lp}" width="${dw}" height="${lp}" fill="#FFB74D" fill-opacity="0.85" stroke="#E65100" stroke-width="1.6"/>`);
      P.push(`<rect x="${cx-dw/2}" y="${y-lp-gr}" width="${dw}" height="${gr}" fill="none" stroke="#E65100" stroke-width="1.6"/>`);
      for(let i=1;i<=2;i++){const yy=y-lp-gr*i/3;
        P.push(`<line x1="${cx-dw/2}" y1="${yy}" x2="${cx+dw/2}" y2="${yy}" stroke="#E65100" stroke-width="1.4"/>`);}
    } else if(t==='ANCHOR'||t==='RIBBON'){
      P.push(`<path d="M ${cx-dw/2} ${y-g.H*sc*0.75} L ${cx-dw/2} ${y}
        Q ${cx} ${y+dw*0.18} ${cx+dw/2} ${y} L ${cx+dw/2} ${y-g.H*sc*0.75}"
        fill="none" stroke="#E65100" stroke-width="3.5"/>`);
    } else {
      const bh=Math.max(g.W*sc,5);
      [-1,1].forEach(s=>{
        P.push(`<rect x="${s<0?cx-dw/2:cx+shaftW/2}" y="${y-bh/2}" width="${dw/2-shaftW/2}" height="${bh}"
          fill="#FFB74D" fill-opacity="0.9" stroke="#E65100" stroke-width="1.4"
          transform="skewX(${g.blade_angle_deg===45?(s<0?14:-14):0})"/>`);
      });
      if(t==='RUSHTON'&&g.disc_D){const ddw=g.disc_D*sc;
        P.push(`<rect x="${cx-ddw/2}" y="${y-2}" width="${ddw}" height="4" fill="#E65100"/>`);}
    }
  });

  const dim=(x1,y1,x2,y2,label,vert)=>{
    const c='#1976D2';
    let s=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1"/>`;
    const cap=(x,y)=>`<line x1="${vert?x-4:x}" y1="${vert?y:y-4}" x2="${vert?x+4:x}" y2="${vert?y:y+4}" stroke="${c}" stroke-width="1"/>`;
    s+=cap(x1,y1)+cap(x2,y2);
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    s+=`<text x="${mx+(vert?-7:0)}" y="${my+(vert?3:-5)}" font-size="10.5" fill="${c}"
      text-anchor="${vert?'end':'middle'}" font-family="sans-serif">${label}</text>`;
    return s;
  };
  P.push(dim(xL,yTop-18,xR,yTop-18,`T = ${(g.T*1000).toFixed(0)}`,false));
  P.push(dim(xL-14,yLiq,xL-14,yBot,`H = ${(g.H*1000).toFixed(0)}`,true));
  P.push(dim(cx-dw/2,yBot-g.elevations[0]*sc+26,cx+dw/2,yBot-g.elevations[0]*sc+26,`D = ${(g.D*1000).toFixed(0)}`,false));
  P.push(dim(xR+16,yBot-g.elevations[0]*sc,xR+16,yBot,`C = ${(g.C*1000).toFixed(0)}`,true));

  const lx=xR+46;
  [['형식',g.impeller_type],['D/T',g.D_T.toFixed(3)],['단수',g.n_impellers+' 단'],
   ['W/D',g.W_D.toFixed(3)],['배플',g.baffled?g.n_baffles+'매':'무배플'],
   ['축','φ'+res.shaft_dia_mm.toFixed(0)],['rpm',res.rpm],['v_tip',n2(res.v_tip,2)+' m/s']
  ].forEach((r,i)=>{
    const y=yTop+8+i*17;
    P.push(`<text x="${lx}" y="${y}" font-size="10.5" fill="#666" font-family="sans-serif">${esc(r[0])}</text>`);
    P.push(`<text x="${lx+44}" y="${y}" font-size="10.5" fill="#333" font-weight="600" font-family="sans-serif">${esc(r[1])}</text>`);
  });
  return `<svg class="tankdraw" viewBox="0 0 ${W} ${Hpx}" xmlns="http://www.w3.org/2000/svg">${P.join('')}</svg>`;
}

/* ---------------- 화면 ---------------- */
const TABS=[['design','선정 계산'],['report','계산서'],['vendor','협력업체 검토서 대조'],
            ['saved','저장 목록'],['ref','계산식 근거']];

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([id,label])=>
    `<button class="tab ${view.tab===id?'active':''}" data-tab="${id}">${esc(label)}${
      id==='saved'&&designs.length?` <span class="b-pill gray">${designs.length}</span>`:''}</button>`).join('');
}

function inputForm(){
  const f=form;
  const impOpts=['<option value="">자동 선정 (점도 기준)</option>'].concat(
    Object.keys(agitcalc.LIT).map(k=>`<option value="${k}" ${f.impellerType===k?'selected':''}>${esc(agitcalc.LIT[k].nameKo)}</option>`)).join('');
  return `
  <div class="card">
    <h3>📋 프로젝트</h3>
    <div class="fg"><label class="fl">예제 불러오기 (실제 D&K켐텍 검토서 조건)</label>
      <select class="fs" id="preset"><option value="">— 선택 —</option>
      ${PRESETS.map((p,i)=>`<option value="${i}">${esc(p.label)}</option>`).join('')}</select></div>
    <div class="frow3">

/* CalcResult 하나를 밝은 HTML 표로. 엔진의 텍스트 report() 대신 쓴다. */
function rptCard(r){
  const rows=[];
  if(r.inputs.length){
    rows.push(`<tr><td class="rpt-sec" colspan="4">입력</td></tr>`);
    r.inputs.forEach(([n,v,u,note])=>rows.push(
      `<tr><td class="k">${esc(n)}</td><td class="v">${esc(agitcalc.fmt(v))}</td>
       <td class="u">${esc(u)}</td><td class="f">${esc(note)}</td></tr>`));
  }
  if(r.steps.length){
    rows.push(`<tr><td class="rpt-sec" colspan="4">계산</td></tr>`);
    r.steps.forEach(([n,f,v,u])=>rows.push(
      `<tr><td class="k">${esc(n)}</td><td class="v">${esc(agitcalc.fmt(v))}</td>
       <td class="u">${esc(u)}</td><td class="f">${esc(f)}</td></tr>`));
  }
  let extra='';
  if(r.checks.length){
    extra+=`<div class="rpt-sec">검토</div><div style="padding:8px 12px">`+
      r.checks.map(([d,p,note])=>`<div class="chk ${p?'ok':'ng'}">${p?'✔':'✘'} ${esc(d)}${
        note?` <span style="opacity:.75">— ${esc(note)}</span>`:''}</div>`).join('')+`</div>`;
  }
  if(r.warnings.length){
    extra+=`<div class="rpt-sec">경고</div><div style="padding:8px 12px">`+
      r.warnings.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')+`</div>`;
  }
  return `<div class="rpt"><div class="rpt-h">${esc(r.title)}${
    r.ref?`<div class="ref">근거: ${esc(r.ref)}</div>`:''}</div>
    <table class="rt">${rows.join('')}</table>${extra}</div>`;
}

/* 형상 치수는 표가 더 읽기 좋아서 별도 표로 낸다 */
function geoCard(g){
  const mm=x=>(x*1000).toFixed(0);
  const row=(k,v,u)=>`<tr><td class="k">${esc(k)}</td><td class="v">${esc(v)}</td><td class="u">${esc(u||'')}</td><td class="f"></td></tr>`;
  const rows=[
    `<tr><td class="rpt-sec" colspan="4">탱크</td></tr>`,
    row('탱크 내경 T',mm(g.T),'mm'), row('액위 H',mm(g.H)+`  (H/T=${g.H_T.toFixed(3)})`,'mm'),
    row('액체 체적 V',g.V.toFixed(3),'m³'),
    `<tr><td class="rpt-sec" colspan="4">임펠러</td></tr>`,
    row('형식',g.impeller_type+' × '+g.n_impellers+'단',''),
    row('임펠러경 D',mm(g.D)+`  (D/T=${g.D_T.toFixed(3)})`,'mm'),
    row('날개폭 W',mm(g.W)+`  (W/D=${g.W_D.toFixed(3)})`,'mm'),
    row('바닥간극 C',mm(g.C)+`  (C/T=${g.C_T.toFixed(3)})`,'mm'),
    ...g.elevations.map((e,i)=>row(`${i+1}단 설치높이 (바닥에서)`,mm(e),'mm')),
    ...(g.spacing?[row('임펠러 간격 S',mm(g.spacing)+`  (S/D=${g.spacing_over_D.toFixed(2)})`,'mm')]:[]),
    ...(g.n_blades?[row('날개 수',g.n_blades,'매')]:[]),
    ...(g.blade_angle_deg?[row('날개 각도',g.blade_angle_deg,'deg')]:[]),
    ...(g.blade_thk?[row('날개 두께',mm(g.blade_thk),'mm')]:[]),
    ...(g.lower_paddle_H?[row('하부 패들 높이',mm(g.lower_paddle_H),'mm')]:[]),
    ...(g.grid_H?[row('상부 격자 높이',mm(g.grid_H),'mm')]:[]),
    ...(g.wall_clearance?[row('벽 간극',mm(g.wall_clearance),'mm')]:[]),
    `<tr><td class="rpt-sec" colspan="4">배플</td></tr>`,
    g.baffled?row('배플',`${g.n_baffles}매 × ${mm(g.B)} (벽간극 ${mm(g.B_wall_clearance)})`,'mm')
             :row('배플','무배플 — 광폭/근접간극 임펠러로 선회류 억제',''),
    row('권장 익단속도',`${g.tip_speed_range[0].toFixed(1)} ~ ${g.tip_speed_range[1].toFixed(1)}`,'m/s')
  ];
  return `<div class="rpt"><div class="rpt-h">임펠러·탱크 형상 치수 — ${esc(g.impeller_name)} (${esc(g.flow)})
    <div class="ref">${esc(g.reason)}</div></div><table class="rt">${rows.join('')}</table></div>`;
}

function runVendor(){
  try{
    // 화면 입력은 mm, 엔진은 m
    const imps=vform.imps.filter(p=>p[0]&&Number(p[1])>0).map(p=>[p[0],Number(p[1])/1000]);
    if(!imps.length) throw new Error('임펠러를 1개 이상 입력하세요');
    const r=agitcalc.topjinSheet({T:Number(vform.T)/1000,V:Number(vform.V),rho:Number(vform.rho),
      mu_cP:Number(vform.mu),rpm:Number(vform.rpm),imps,mechEff:Number(vform.mechEff),
      motor_kW:Number(vform.motor)||null,hasCoil:!!vform.hasCoil,
      baffled:vform.baffled==='yes'});
    const rows=[['Reynolds수',vform.pRe,r.results.Re,''],['TIP SPEED',vform.pTP,r.results.TP,'m/s'],
      ['토출유량수 Q/V',vform.pQV,r.results.QV,'回/min'],['계산동력',vform.pPcalc,r.results.P_calc_kW,'kW'],
      ['보정동력',vform.pPcorr,r.results.P_corr_kW,'kW'],['부하율',vform.pLoad,r.results.load_pct,'%']];
    const body=rows.map(([label,want,got,unit])=>{
      const w=Number(want); if(!isFinite(w)||w===0) return '';
      const err=Math.abs(got-w)/Math.abs(w)*100;
      const cls=err<=0.1?'green':(err<=20?'orange':'red');
      const tag=err<=0.1?'일치':(err<=20?'차이':'큰 차이');
      return `<tr><td>${esc(label)}</td><td class="num">${n2(w,4)}</td><td class="num">${n2(got,4)}</td>
        <td class="num">${n2(err,2)}%</td><td><span class="b-pill ${cls}">${tag}</span></td><td>${esc(unit)}</td></tr>`;
    }).join('');
    const N=Number(vform.rpm)/60, D=imps[0][1], T=Number(vform.T)/1000, V=Number(vform.V);
    const H=agitcalc.liquidHeight(T,V);
    const key=agitcalc.VENDOR_ALIAS[imps[0][0].toUpperCase()]||imps[0][0].toUpperCase();
    const pn=agitcalc.powerNumber(r.results.Re,key,{baffled:r.results.baffled});
    const bt=agitcalc.blendTime(N,D,T,H,pn.Np,r.results.Re,key);
    vresult=`<div class="card"><h3>⇄ 대조 결과</h3><table class="t">
      <thead><tr><th>항목</th><th>검토서</th><th>agitcalc</th><th>차이</th><th>판정</th><th>단위</th></tr></thead>
      <tbody>${body}</tbody></table></div>
      <div class="card"><h3>🕐 혼합시간 별도 산출</h3><table class="t">
        <tr><td>유체역학적 θ95 (agitcalc)</td><td class="num">${n2(bt.theta/60,2)}</td><td>min</td></tr>
        <tr><td>산정근거</td><td colspan="2">${esc(bt.basis)}</td></tr></table>
        <div class="warn" style="margin-top:10px">⚠ 검토서의 '교반소요시간(추정)'은 8건 모두 표준 상관식으로
        재현되지 않았습니다 (t × Q/V 회전수가 88~840회로 30배 흩어짐). 공정 요구시간을 기입한 것으로
        추정되므로 <b>유체역학적 혼합시간과는 다른 값</b>으로 이해하고 벤더에 정의를 확인하십시오.</div></div>
      <div class="card"><h3>📋 재현 계산 상세</h3>${rptCard(r)}</div>`;
  }catch(e){vresult=`<div class="card"><div class="chk ng">⚠ ${esc(e.message||e)}</div></div>`;}
  render();
}

function render(){
  renderTabs();
  const app=document.getElementById('app');
  if(view.tab==='design') app.innerHTML=`<div class="grid2"><div>${inputForm()}</div><div>${resultPanel()}</div></div>`;
  else if(view.tab==='report') app.innerHTML=reportTab();
  else if(view.tab==='vendor') app.innerHTML=vendorTab();
  else if(view.tab==='saved') app.innerHTML=savedTab();
  else app.innerHTML=refTab();
}

/* ---------------- Excel 내려받기 ----------------
   ponytail: HTML 표를 .xls 로 내보낸다 — Excel 이 HTML 테이블을 그대로 열고
   서식(굵기·정렬·테두리)까지 살린다. SheetJS 같은 라이브러리를 넣지 않는 이유.
   진짜 .xlsx(수식·여러 시트·차트)가 필요해지면 그때 SheetJS 를 붙일 것.        */
function downloadXls(){
  const r=view.result, g=r.geometry, s=r.shaft.results, f=form;
  const mm=x=>Math.round(x*1000);
  const H=(t)=>`<tr><td colspan="3" style="background:#D9E7F5;font-weight:bold">${esc(t)}</td></tr>`;
  const R=(k,v,u)=>`<tr><td>${esc(k)}</td><td style="text-align:right">${esc(v)}</td><td>${esc(u||'')}</td></tr>`;
  const rows=[
    H('프로젝트'),
    R('발주처',f.customer||'—'), R('Project',f.project||'—'), R('ITEM NO.',f.item||'—'),
    R('작성일',new Date().toISOString().slice(0,10)), R('작성도구','agitcalc v0.1 (㈜세종기술 기술부)'),
    H('공정 조건'),
    R('액체 체적 V',g.V,'m³'), R('탱크 내경 T',mm(g.T),'mm'), R('액위 H',mm(g.H),'mm'),
    R('H/T',g.H_T.toFixed(3),''), R('비중 ρ',f.rho,'kg/m³'), R('점도 μ',f.mu,'cP'),
    H('임펠러 형상'),
    R('형식',g.impeller_type,''), R('단수',g.n_impellers,'단'),
    R('임펠러경 D',mm(g.D),'mm'), R('D/T',g.D_T.toFixed(3),''),
    R('날개폭 W',mm(g.W),'mm'), R('W/D',g.W_D.toFixed(3),''),
    R('바닥간극 C',mm(g.C),'mm'), R('C/T',g.C_T.toFixed(3),''),
    ...g.elevations.map((e,i)=>R(`${i+1}단 설치높이`,mm(e),'mm')),
    R('배플',g.baffled?`${g.n_baffles}매 × ${mm(g.B)}mm`:'무배플',''),
    H('수력 성능'),
    R('회전수 N',r.rpm,'rpm'), R('Reynolds수 Re',r.Re.toFixed(1),''),
    R('유동영역',agitcalc.flowRegime(r.Re),''), R('동력수 Np',r.Np.toFixed(4),''),
    R('익단속도 v_tip',r.v_tip.toFixed(3),'m/s'), R('Froude수 Fr',r.Fr.toFixed(4),''),
    R('액체전달동력 P',(r.P_liquid/1000).toFixed(3),'kW'), R('단위체적동력 P/V',r.PV.toFixed(1),'W/m³'),
    R('총 토출량 Q',(r.Q_total*60).toFixed(2),'m³/min'), R('탱크 순환시간',r.turnover_s.toFixed(1),'s'),
    R('혼합시간 θ95',(r.theta95_s/60).toFixed(2),'min'),
    H('구동부'),
    R('선정 모터',r.motor_kW,'kW'), R('부하율',r.load_pct.toFixed(1),'%'),
    H('축 검토'),
    R('축경',mm(r.shaft_dia_mm/1000),'mm'), R('축 전장',Math.round(r.shaft_len_mm),'mm'),
    R('설계토크',s.T_design_Nm.toFixed(1),'N·m'), R('비틀림응력 τ',s.tau_MPa.toFixed(2),'MPa'),
    R('굽힘응력 σb',s.sigma_b_MPa.toFixed(2),'MPa'), R('조합응력 τmax',s.tau_max_MPa.toFixed(2),'MPa'),
    R('허용응력 τallow',s.tau_allow_MPa.toFixed(2),'MPa'), R('안전율',s.SF_stress.toFixed(2),''),
    R('최하단 처짐',s.delta_tip_mm.toFixed(3),'mm'), R('1차 위험속도 Nc',s.N_crit_rpm.toFixed(1),'rpm'),
    R('N/Nc',s.N_over_Nc.toFixed(3),''),
    H('검토 결과'),
    ...r.summary.checks.concat(r.shaft.checks).map(([d,p])=>R(d,p?'OK':'NG','')),
    ...(r.summary.warnings.length?[H('경고'),...r.summary.warnings.map((w,i)=>R('경고 '+(i+1),w,''))]:[])
  ];
  const html=`<html><head><meta charset="utf-8"></head><body>
    <table border="1" cellspacing="0" cellpadding="4"
      style="border-collapse:collapse;font-family:'맑은 고딕';font-size:10pt">
      <tr><td colspan="3" style="background:#1976D2;color:#fff;font-size:13pt;font-weight:bold">
        교반기 선정 검토서</td></tr>
      ${rows.join('')}
    </table></body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+html],{type:'application/vnd.ms-excel'}));
  a.download=`교반기선정_${(f.item||'ITEM')}_${new Date().toISOString().slice(0,10)}.xls`;
  a.click();
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){view.tab=tb.dataset.tab;render();return;}
  if(e.target.closest('#btnCalc')){runDesign();return;}
  if(e.target.closest('#btnReset')){form=Object.assign({},DEFAULTS);view.result=null;view.error=null;render();return;}
  if(e.target.closest('#btnVendor')){runVendor();return;}
  if(e.target.closest('#btnSheet')){view.tab='report';render();return;}
  if(e.target.closest('#btnCopy')&&view.result){
    navigator.clipboard.writeText(agitcalc.fullReport(view.result))
      .then(()=>alert('계산서를 클립보드에 복사했습니다.'),()=>alert('복사 실패'));
    return;}
  if(e.target.closest('#btnPrint')){window.print();return;}
  if(e.target.closest('#btnXls')&&view.result){downloadXls();return;}
  if(e.target.closest('#btnSave')&&view.result){
    const r=view.result,g=r.geometry;
    designs.push({id:uid(),customer:form.customer,project:form.project,item:form.item,
      T:g.T,V:g.V,rho:Number(form.rho),mu:Number(form.mu),impellerType:g.impeller_type,
      D_mm:Math.round(g.D*1000),rpm:r.rpm,motor_kW:r.motor_kW,load_pct:r.load_pct,
      shaft_dia_mm:r.shaft_dia_mm,ok:r.summary.ok,inputs:Object.assign({},form),savedAt:nowISO()});
    saveLS();alert('저장했습니다 (이 브라우저에만).');view.tab='saved';render();return;}
  if(e.target.closest('#btnCsv')&&view.result){downloadXls();return;}
  const lb=e.target.closest('[data-load]');
  if(lb){const d=designs.find(x=>x.id===lb.dataset.load);
    if(d&&d.inputs){form=Object.assign({},DEFAULTS,d.inputs);view.tab='design';runDesign();}return;}
  const db=e.target.closest('[data-del]');
  if(db){if(!confirm('삭제하시겠습니까?'))return;
    designs=designs.filter(x=>x.id!==db.dataset.del);saveLS();render();return;}
});

document.addEventListener('input',e=>{
  const f=e.target.dataset.f; if(f){form[f]=e.target.value;return;}
  const v=e.target.dataset.v; if(v){vform[v]=e.target.type==='checkbox'?e.target.checked:e.target.value;return;}
  const vi=e.target.dataset.vi; if(vi!=null){vform.imps[Number(vi)][0]=e.target.value;return;}
  const vd=e.target.dataset.vd; if(vd!=null){vform.imps[Number(vd)][1]=e.target.value;return;}
});

document.addEventListener('change',e=>{
  if(e.target.id==='preset'){
    const i=e.target.value; if(i==='')return;
    Object.assign(form,PRESETS[Number(i)].v);
    runDesign(); return;
  }
  if(e.target.dataset.f==='basis'){form.basis=e.target.value;render();}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&view.tab==='design'&&e.target.classList.contains('fi')) runDesign();
});

loadLS();
render();
</script>
</body>
</html>
