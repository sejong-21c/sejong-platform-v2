<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITP 조회</title>
<!-- 이모지 → Lucide 선 아이콘 (index.html과 동일 패턴) -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js" defer onload="try{lucide.createIcons()}catch(e){}"></script>
<script type="module">
  // ITP Builder(v2.1+)가 저장한 t_itpBuilderDocs 컬렉션을 읽기 전용으로 조회한다.
  // 각 문서 = 프로젝트 1개, 문서 안 items[]에 각 아이템의 ITP rows·설계 데이터가 들어있다.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot, doc, deleteDoc, getDocs, getDoc, setDoc, query, where, documentId } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCmGyObjPd20Qf1MX0XAijYzSR4VitrjRg",
    authDomain: "sejong-platform.firebaseapp.com",
    projectId: "sejong-platform",
    storageBucket: "sejong-platform.firebasestorage.app",
    messagingSenderId: "884301297710",
    appId: "1:884301297710:web:82b2e065119f7c5d9d87bf",
    measurementId: "G-8LJDWYVJ5G"
  };
  const fbApp = initializeApp(firebaseConfig);
  // v2.2(점검 A3): IndexedDB 영속 캐시 — 조회 탭을 다시 열어도 캐시에서 즉시 그리고 서버에선
  // 변경분만 받는다 (전에는 메모리 캐시뿐이라 iframe 재생성 때마다 전 문서 재다운로드).
  // 같은 오리진에 iframe이 여러 개 떠서 multi-tab 매니저 필수 — 아니면 캐시가 조용히 꺼짐.
  const db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  window.fb = { auth: getAuth(fbApp), db, collection, onSnapshot, doc, deleteDoc, getDocs, getDoc, setDoc, query, where, documentId };
</script>
<style>
:root {
  --primary:#7c3aed; --primary-light:#f5f3ff; --primary-lighter:#faf5ff;
  --bg:#F5F7FA; --white:#fff; --border:#E0E0E0; --border-light:#F0F0F0;
  --text:#333; --text-light:#666; --text-lighter:#999; --danger:#dc2626;
  --success:#059669; --radius:8px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif; background:var(--bg); color:var(--text); font-size:13px; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
#app { flex:1; overflow-y:auto; padding:20px 24px 40px; }
.hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.hd h1 { font-size:16px; font-weight:700; }
.hd .sub { font-size:11px; color:var(--text-light); margin-top:2px; }
.btn { padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--white); cursor:pointer; font-size:12px; font-family:inherit; display:inline-flex; align-items:center; gap:5px; }
.btn:hover { background:var(--bg); }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:#6d28d9; }
.filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:14px; }
.filter-bar input, .filter-bar select { padding:6px 10px; border:1.5px solid var(--border); border-radius:6px; font-size:12px; font-family:inherit; background:#fff; }
.filter-bar .cnt { margin-left:auto; font-size:11px; color:var(--text-light); }

.proj-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.proj-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; cursor:pointer; transition:transform .1s, box-shadow .1s, border-color .1s; }
.proj-card:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(124,58,237,.10); border-color:var(--primary); }
.proj-card .code { font-size:11px; color:var(--primary); font-weight:700; letter-spacing:.5px; }
.proj-card .name { font-size:14px; font-weight:700; margin-top:4px; color:var(--text); }
.proj-card .client { font-size:11px; color:var(--text-light); margin-top:6px; }
.proj-card .meta { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border-light); }
.proj-card .item-cnt { font-size:12px; color:var(--text); }
.proj-card .item-cnt b { color:var(--primary); font-size:15px; }
.proj-card .stamp { font-size:10px; color:var(--text-lighter); }

.section { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
.section h3 { font-size:14px; margin-bottom:10px; }

.item-list { display:flex; flex-direction:column; gap:8px; }
.item-row { display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--border-light); border-radius:6px; cursor:pointer; background:#fff; transition:background .1s, border-color .1s; }
.item-row:hover { background:var(--primary-lighter); border-color:var(--primary); }
.item-row .no { font-size:12px; font-weight:700; color:var(--primary); min-width:70px; }
.item-row .nm { font-size:13px; font-weight:600; color:var(--text); flex:1; }
.item-row .badges { display:flex; gap:6px; }
.badge { font-size:10px; padding:2px 8px; border-radius:10px; background:var(--primary-light); color:var(--primary); font-weight:600; }
.badge.gray { background:var(--border-light); color:var(--text-light); }
.item-row .arrow { color:var(--text-lighter); font-size:14px; }

.itp-table { width:100%; border-collapse:collapse; font-size:11.5px; }
.itp-table thead th { background:var(--primary-lighter); padding:8px 10px; text-align:left; font-size:10.5px; font-weight:700; color:var(--primary); border-bottom:1px solid var(--primary-light); white-space:nowrap; position:sticky; top:0; }
.itp-table td { padding:7px 10px; border-bottom:1px solid var(--border-light); vertical-align:top; }
.itp-table td.center { text-align:center; }
.itp-table tbody tr:hover { background:#fafafa; }

.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:12px; }
.breadcrumb a { color:var(--primary); text-decoration:none; cursor:pointer; }
.breadcrumb a:hover { text-decoration:underline; }
.breadcrumb span.sep { margin:0 6px; color:var(--text-lighter); }

.empty { text-align:center; padding:40px; color:var(--text-lighter); font-size:13px; background:var(--white); border:1px dashed var(--border); border-radius:var(--radius); }
.loading { text-align:center; padding:40px; color:var(--text-lighter); font-size:13px; }

/* 이모지 → Lucide 변환 전 폴백(이모지) 숨김 → svg만 표시 (index.html과 동일 규칙) */
i[data-lucide] { font-size:0; color:transparent; display:inline-flex; align-items:center; }
i[data-lucide] > svg { font-size:13px; color:initial; width:13px; height:13px; }

/* v1.4: ITP Builder 미리보기와 동일한 공식 문서 양식 · A4 세로 비율(210mm) 컨테이너 */
.itp-doc { background:#fff; border:1px solid var(--border); border-radius:8px; padding:18mm 12mm; width:210mm; max-width:100%; margin:0 auto; font-family:Arial,'Malgun Gothic',sans-serif; box-shadow:0 2px 10px rgba(0,0,0,.06); }
.itp-hdr { width:100%; border-collapse:collapse; }
.itp-hdr td { border:1px solid #555; padding:3px 6px; font-size:10px; vertical-align:middle; }
.itp-hdr td.k { font-weight:500; white-space:nowrap; }
.itp-hdr td.itp-logo { padding:4px 6px; }
.itp-grid { width:100%; border-collapse:collapse; margin-top:-1px; }
.itp-grid th { border:1px solid #555; padding:5px 6px; background:#fff; font-size:10px; font-weight:500; text-align:center; vertical-align:middle; }
.itp-grid td { border:1px solid #888; padding:4px 5px; font-size:9px; vertical-align:top; line-height:1.5; }
.itp-grid td.ish-no { text-align:center; vertical-align:middle; font-weight:600; font-size:11px; }
.itp-grid td.ish-c { text-align:center; }
.itp-grid td.ish-l { text-align:left; }
.itp-grid td.ish-sm { font-size:9px; }
.itp-note { margin-top:4px; font-size:9px; color:#444; line-height:1.7; }
@media print {
  /* body/#app이 화면용으로 height:100vh+overflow:hidden(스크롤 패널) 구조라, 이걸
     인쇄 시에도 그대로 두면 브라우저가 뷰포트 한 화면 분량만 찍고 나머지 내용은
     잘려나간다(표지+ITP가 한 페이지에 겹쳐 보이고 ITP 본문이 잘리는 원인). 인쇄
     시에는 항상 auto/visible로 풀어서 전체 내용이 자연스럽게 여러 페이지로 흐르게 한다. */
  html, body { height:auto !important; overflow:visible !important; background:#fff; }
  #app { flex:none !important; overflow:visible !important; padding:0; }
  .no-print, .breadcrumb { display:none !important; }
  /* v3.0: 표지만 landscape로 찍으려고 이름있는 페이지(@page + page:)를 써봤지만,
     크롬 인쇄 엔진이 문서 전체의 레이아웃 폭을 페이지별로 다시 계산해주지 않아
     본문·표지 둘 다 엉뚱하게 넓은 여백이 생기는 부작용이 있었다(실사용 확인).
     혼합 방향은 포기하고 문서 전체를 portrait 하나로 통일 — 원본 회사 서식도
     portrait였으므로 이게 더 안전하고 예측 가능하다. */
  .itp-doc { border:none; padding:0; width:100%; }
  @page { size:A4 portrait; margin:10mm; }
  /* v3.2: 개정이력 표를 인쇄 페이지 맨아래에 고정(원본 서식과 동일 — 내용이 늘면
     표가 위로 자라고, 표 하단 위치는 그대로) — 화면에서 이 min-height/flex를 그대로
     쓰면 예전에 겪었던 "빈 공백 과다" 버그가 재현되므로 인쇄 시에만 적용한다. */
  .itp-cover { min-height:274mm; display:flex; flex-direction:column; }
  .itp-cover-revwrap { margin-top:auto; }
}
</style>
</head>

//   재승인되면 decideApproval/즉시승인 이 스냅샷을 갱신한다.
//   liveDocs(t_itpBuilderDocs)는 ① 레거시 승인 문서 자가복구(스냅샷 생성) ② '개정 작업 중' 배지용.
const state = { itpDocs: [], snapDocs: [], liveDocs: [], projects: [], selectedPid: null, selectedItem: null, filter: '' };
const _healed = new Set();   // 세션 중 자가복구 중복 쓰기 방지
// v2.6: 승인이 프로젝트 단위 → 아이템 단위로 바뀜(itpApprovalByItem). 문서(스냅샷/
// 라이브) 자체는 여전히 프로젝트당 1개라 구조는 그대로 두고, 아이템별 승인 상태만
// 이 맵에서 읽는다. 이 변경 이전에 승인된 문서는 이 맵이 없으므로 최상위
// approvalStatus로 소급 폴백(그 프로젝트의 모든 아이템이 승인된 것으로 간주).
function getItemApproval(doc, itemId) {
  if (!doc) return null;
  const a = (doc.itpApprovalByItem || {})[itemId];
  if (a) return a;
  if (doc.approvalStatus === 'approved') return { status: 'approved', approvedBy: doc.approvedBy, approvedAt: doc.approvedAt, legacy: true };
  return null;
}
function _docHasAnyApproved(doc) {
  if (doc.approvalStatus === 'approved') return true; // 레거시(프로젝트 전체 승인)
  return Object.values(doc.itpApprovalByItem || {}).some(a => a.status === 'approved');
}
function _mergeDocs() {
  const snapByPid = {};
  state.snapDocs.forEach(d => { snapByPid[d.pid] = d; });
  const merged = state.snapDocs.map(d => {
    const live = state.liveDocs.find(x => x.pid === d.pid);
    return { ...d, _live: live || null };
  });
  state.liveDocs.forEach(live => {
    // v2.6: 레거시 자가복구는 "프로젝트 전체가 approved"인 옛 문서에만 적용 —
    //   아이템 단위 승인은 승인 시점에 항상 스냅샷을 함께 patch하므로 복구가 필요 없다.
    if (live.approvalStatus !== 'approved') return;
    const snap = snapByPid[live.pid];
    const needHeal = !snap || (Number(live.approvedAt)||0) > (Number(snap.approvedAt)||0);
    if (!snap) merged.push({ ...live, _live: live });   // 스냅샷 생기기 전에도 조회엔 보이게
    if (needHeal && !_healed.has(live.pid) && fb.auth && fb.auth.currentUser) {
      _healed.add(live.pid);
      const { contentSig, approvedSig, itpContentSigByItem, ...copy } = live;
      const { pid, ...fields } = copy;
      fb.setDoc(fb.doc(fb.db, 't_itpApproved', live.pid), { ...fields, snapshotAt: Date.now() })
        .then(() => console.log('[ITP조회] 승인본 스냅샷 자가복구:', live.pid))
        .catch(e => { _healed.delete(live.pid); console.warn('[ITP조회] 스냅샷 자가복구 실패:', e.message); });
    }
  });
  state.itpDocs = merged;
}

// 아이콘 렌더 헬퍼 — lucide 로드 실패 시 <i> 안의 이모지가 그대로 보임(안전 폴백). index.html과 동일 패턴.
function LI(li, emoji) { return li ? `<i data-lucide="${li}">${emoji || ''}</i>` : (emoji || ''); }

// 딥링크: ?pid=&tag=(&item=) 로 특정 아이템 바로 열기 (제작공정관리의 'ITP 조회 →' 버튼)
const _dl = (() => { try { const q=new URLSearchParams(location.search); const pid=q.get('pid'); if(!pid) return null; return { pid, tag:(q.get('tag')||'').trim(), item:q.get('item') }; } catch(e){ return null; } })();
let _dlApplied = false;
function _applyDeepLink() {
  if (!_dl || _dlApplied) return;
  const doc = state.itpDocs.find(d => d.pid === _dl.pid);
  if (!doc) return;               // 아직 로드 전 — 다음 스냅샷에서 재시도
  _dlApplied = true;
  state.selectedPid = _dl.pid;
  const items = doc.items || [];
  let idx = -1;
  if (_dl.tag) idx = items.findIndex(x => ((x.tag||'').trim() === _dl.tag));
  if (idx < 0 && _dl.item != null && _dl.item !== '') { const n = parseInt(_dl.item, 10); if (!isNaN(n)) idx = n; }
  state.selectedItem = (idx >= 0 && idx < items.length) ? idx : null;
}

function startSync() {
  if (!window.fb || !fb.db) { setTimeout(startSync, 300); return; }
  if (!fb.auth || !fb.auth.currentUser) { setTimeout(startSync, 400); return; }
  // v2.1 ★ 성능 ★ — 컬렉션 전체 구독은 도면 청크 문서(chunk__*/dwg_*, base64 수백KB짜리)까지
  //   전부 다운로드해 탭 열림이 느렸다. 실제 프로젝트 문서 id는 전부 'p'로 시작하므로
  //   documentId 범위 쿼리로 프로젝트 문서만 받는다 (청크는 네트워크에서 아예 제외).
  const _projOnly = (coll) => fb.query(fb.collection(fb.db, coll), fb.where(fb.documentId(), '>=', 'p'), fb.where(fb.documentId(), '<', 'q'));
  // v2.0: 승인본 스냅샷(t_itpApproved)이 조회의 원본
  fb.onSnapshot(_projOnly('t_itpApproved'), snap => {
    state.snapDocs = snap.docs
      .filter(d => !d.id.startsWith('chunk__') && !d.id.startsWith('dwg_'))
      .map(d => ({ pid: d.id, ...d.data() }));
    _mergeDocs();
    _applyDeepLink();
    render();
  }, e => { document.getElementById('app').innerHTML = `<div class="empty">불러오기 실패: ${e.message||e}<br><small>페이지를 새로고침해 주세요.</small></div>`; });
  // v2.2 ★ 성능(점검 B3) ★ — 라이브 문서(t_itpBuilderDocs)는 ① 레거시 승인분 자가복구
  //   ② '개정 작업 중' 배지, 이 두 가지에만 쓰인다. 그런데 예전엔 이걸 실시간 구독해서
  //   승인본과 '같은 본문을 두 번' 받았고(검사행 수백 개 × 프로젝트 수), 누가 빌더에서
  //   저장할 때마다 조회 화면에도 문서 전체가 재전송됐다.
  //   → 목록이 먼저 뜨고 난 뒤(1.2초 후) 1회만 조회하는 안전망으로 격하. 배지는 위 liveStatus로.
  setTimeout(() => {
    fb.getDocs(_projOnly('t_itpBuilderDocs')).then(snap => {
      state.liveDocs = snap.docs
        .filter(d => !d.id.startsWith('chunk__') && !d.id.startsWith('dwg_'))
        .map(d => ({ pid: d.id, ...d.data() }));
      _mergeDocs();
      _applyDeepLink();
      render();
    }).catch(e => console.warn('[liveDocs]', e));
  }, 1200);
  fb.onSnapshot(fb.collection(fb.db, 'projects'), snap => {
    state.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, e => console.warn('[projects]', e));
}

function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function projLabel(doc) {
  const p = state.projects.find(x => x.id === doc.pid);
  const proj = doc.proj || {};
  return {
    code: proj.no || p?.code || '-',
    name: proj.name || p?.name || doc.pid,
    client: proj.client || p?.client || ''
  };
}
function goProj(pid) { state.selectedPid = pid; state.selectedItem = null; render(); scrollToTop(); }
function goItem(idx) { state.selectedItem = idx; render(); scrollToTop(); }
function goBack() {
  if (state.selectedItem != null) { state.selectedItem = null; render(); scrollToTop(); }
  else if (state.selectedPid) { state.selectedPid = null; render(); scrollToTop(); }
}
function scrollToTop() { document.getElementById('app').scrollTop = 0; }

// v2.9: 예전엔 item "인덱스"를 넘겼는데 itp-builder.html은 그 파라미터를 아예 읽지
// 않아 항상 첫 아이템(0단계)으로 열렸다 — 결재 문서를 확인하려 해도 원하는 아이템으로
// 못 가던 원인 중 하나. 이제 아이템의 실제 id(iid)·tag를 넘기고, itp-builder.html이
// 이를 받아 그 아이템의 미리보기(2단계)로 바로 이동한다.
function openBuilder(pid, itemId, itemTag) {
  const qs = new URLSearchParams({ pid });
  if (itemId != null) qs.set('iid', itemId);
  if (itemTag) qs.set('tag', itemTag);
  window.open('../itp-builder/itp-builder.html?' + qs.toString(), '_blank', 'noopener');
}

function renderList() {
  const filter = state.filter.trim().toLowerCase();
  const docs = state.itpDocs
    .filter(d => (d.items||[]).length > 0)          // 아이템 하나도 없는 문서는 숨김
    .filter(d => _docHasAnyApproved(d))             // v2.6: 아이템 중 하나라도 승인 완료면 노출(작성→상신→승인 후)
    .map(d => ({ ...d, ...projLabel(d) }))
    .filter(d => !filter || d.code.toLowerCase().includes(filter) || d.name.toLowerCase().includes(filter) || d.client.toLowerCase().includes(filter))
    .sort((a,b) => (a.code||'').localeCompare(b.code||''));

  const cards = docs.map(d => {
    const items = d.items || [];
    const approvedCount = items.filter(it => getItemApproval(d, it.id)?.status === 'approved').length;
    const savedAt = d.approvedAt ? new Date(Number(d.approvedAt)).toISOString().slice(0,10) : (d.savedAt ? new Date(d.savedAt).toISOString().slice(0,10) : '');
    // v2.6: '개정 작업 중'도 이제 아이템 단위 — 하나라도 결재중/개정중이면 배지 표시
    const anyEditing = items.some(it => {
      const live = (d._live && (d._live.itpApprovalByItem||{})[it.id]) || null;
      return live && (live.status === 'draft' || live.status === 'pending');
    });
    const editing = anyEditing
      ? `<span style="font-size:10px;background:#fef3c7;color:#92400e;border-radius:9px;padding:1px 7px;margin-left:6px;" title="ITP Builder에서 일부 아이템이 결재중/개정 편집 중입니다">✏ 개정 작업 중</span>` : '';
    return `<div class="proj-card" onclick="goProj('${esc(d.pid)}')">
      <div class="code">${esc(d.code)}${editing}</div>
      <div class="name">${esc(d.name)}</div>
      ${d.client ? `<div class="client">${esc(d.client)}</div>` : ''}
      <div class="meta">
        <div class="item-cnt">아이템 <b>${approvedCount}/${items.length}</b>개 승인</div>
        <div class="stamp">승인 ${savedAt}</div>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="hd">
      <div>
        <h1>${LI('library','📚')} ITP 조회</h1>
        <div class="sub">결재 <b>승인 완료</b>된 ITP만 조회됩니다 · 작성 → 결재 상신 → PM·부서장 승인 후 여기에 표시 (읽기 전용)</div>
      </div>
    </div>
    <div class="filter-bar">
      <input type="text" placeholder="프로젝트 코드·이름·발주처로 검색" value="${esc(state.filter)}"
             oninput="state.filter=this.value;render()" style="flex:1;min-width:220px;">
      <span class="cnt">승인 완료 ${docs.length}건</span>
    </div>
    ${docs.length ? `<div class="proj-grid">${cards}</div>`
                  : `<div class="empty">${state.filter ? '검색 조건에 해당하는 승인 ITP가 없습니다.' : '아직 <b>승인 완료된</b> ITP가 없습니다.<br>ITP Builder에서 작성 후 결재 상신 → 승인하면 여기에 표시됩니다.'}</div>`}
  `;
}

function renderProj() {
  const doc = state.itpDocs.find(d => d.pid === state.selectedPid);
  if (!doc) return renderList();
  const lbl = projLabel(doc);
  const items = doc.items || [];
  const savedAt = doc.savedAt ? new Date(doc.savedAt).toISOString().replace('T',' ').slice(0,16) : '';

  // v2.6: 결재 상태 배지 — 프로젝트 단위가 아니라 아이템 단위
  const AP = { pending:['결재중','#fef3c7','#92400e'], approved:[LI('circle-check','✅')+' 승인 완료','#dcfce7','#166534'], rejected:['반려됨','#fee2e2','#b91c1c'], draft:['개정중','#fef3c7','#92400e'] };
  const rows = items.map((it, i) => {
    const rowCount = _itpRows(doc, it).length;
    const label = ((it.name || it.tag || '아이템') + (it.tag ? ' · ' + it.tag : '')).replace(/'/g,'');
    const itemApp = getItemApproval(doc, it.id);
    const liveApp = (doc._live && (doc._live.itpApprovalByItem||{})[it.id]) || null;
    // 승인본 스냅샷엔 아직 approved로 안 남았지만 라이브에 결재중/개정중이 있으면 그 상태를 우선 표시
    const dispStatus = (liveApp && liveApp.status !== 'approved') ? liveApp.status : (itemApp ? itemApp.status : null);
    const apInfo = AP[dispStatus];
    const itemBadge = apInfo ? `<span class="badge" style="background:${apInfo[1]};color:${apInfo[2]};">${apInfo[0]}</span>` : `<span class="badge gray">미승인</span>`;
    return `<div class="item-row" onclick="goItem(${i})">
      <div class="no">#${i+1}</div>
      <div class="nm">${esc(it.name || it.tag || '(이름 없음)')} ${it.tag ? `<span style="font-weight:400;color:var(--text-light);">· ${esc(it.tag)}</span>` : ''}</div>
      <div class="badges">
        ${it.type ? `<span class="badge">${esc(it.type)}</span>` : ''}
        <span class="badge gray">${rowCount}행</span>
        ${_itpDocNo(doc, it) ? `<span class="badge">${esc(_itpDocNo(doc, it))}${_itpRev(doc,it)?' Rev.'+esc(_itpRev(doc,it)):''}</span>` : ''}
        ${itemBadge}
      </div>
      <button onclick="event.stopPropagation();deleteItpItem('${esc(doc.pid)}','${esc(it.id||'')}',${i},'${esc(label)}')" title="이 아이템만 삭제" style="flex-shrink:0;background:#fff5f5;color:#dc2626;border:1px solid #fca5a5;border-radius:5px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;">${LI('trash-2','🗑')}</button>
      <div class="arrow">›</div>
    </div>`;
  }).join('');

  // v2.6: 프로젝트 헤더 배지는 전체 요약(N/M 아이템 승인)으로 — 개별 상태는 위 아이템 행에서 확인
  const approvedCount = items.filter(it => getItemApproval(doc, it.id)?.status === 'approved').length;
  let apBadge = `<span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:11px;background:#dcfce7;color:#166534;margin-left:8px;vertical-align:middle;">${LI('circle-check','✅')} ${approvedCount}/${items.length} 아이템 승인</span>`;

  return `
    <div class="breadcrumb"><a onclick="goBack()">${LI('library','📚')} ITP 조회</a><span class="sep">›</span><b>${esc(lbl.code)} ${esc(lbl.name)}</b></div>
    <div class="hd">
      <div>
        <h1>${esc(lbl.code)} · ${esc(lbl.name)}${apBadge}</h1>
        <div class="sub">${lbl.client ? esc(lbl.client) + ' · ' : ''}${savedAt ? '최근 저장 ' + savedAt : ''}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="goBack()">← 목록</button>
        <button class="btn btn-primary" onclick="openBuilder('${esc(doc.pid)}')">${LI('clipboard-list','📋')} Builder 열기</button>
      </div>
    </div>
    <div class="section">
      <h3>${LI('package','📦')} 아이템 (${items.length}개) <span style="font-size:11px;color:var(--text-lighter);font-weight:400;">— 행 클릭 시 상세, ${LI('trash-2','🗑')} 클릭 시 그 아이템만 삭제</span></h3>
      ${items.length ? `<div class="item-list">${rows}</div>` : '<div class="empty">이 프로젝트에는 등록된 아이템이 없습니다.</div>'}
    </div>
  `;
}

// v1.3: ITP Builder 저장 구조에 맞춘 행/헤더 접근 헬퍼.
//   검사항목은 item.rows가 아니라 doc.itpRowsByItem[itemId]에 저장됨(빌더 v2.1+ 구조).
//   행 필드: {activity, code, criteria, doc, witness:{sj,qc,client}, remarks}
//   Document No/Rev도 doc.itpDocNoByItem / itpRevByItem 맵에 아이템별로 저장.
function _itpRows(doc, it) {
  const m = doc.itpRowsByItem || {};
  const r = m[it.id] || m[String(it.id)];
  if (Array.isArray(r)) return r;
  return Array.isArray(it.rows) ? it.rows : [];   // 구버전 폴백
}
function _itpDocNo(doc, it) { const m = doc.itpDocNoByItem||{}; return m[it.id] || m[String(it.id)] || it.docNo || ''; }
function _itpRev(doc, it) { const m = doc.itpRevByItem||{}; return m[it.id] || m[String(it.id)] || it.rev || ''; }

// v2.7: 아이템 갑지(표지)용 개정이력 — pid__itemId로 캐시. render()는 동기 함수라
// Firestore 조회는 백그라운드로 돌리고, 결과가 오면 다시 render()를 불러 반영한다.
// 회사 표준 종이 서식(Inspection And Test Plan) 그대로 재현 — uid는 users 컬렉션에서
// 이름으로 변환해 표시(한 번만 불러와 캐싱).
const _coverHistoryCache = {};
let _coverUsersMap = null;
async function _fetchItpCoverHistory(pid, itemId) {
  const key = pid + '__' + itemId;
  if (_coverHistoryCache[key] !== undefined) return; // 조회 중이거나 이미 받음
  _coverHistoryCache[key] = null;
  if (!window.fb || !fb.db) { _coverHistoryCache[key] = []; return; }
  let rows = [];
  // v3.4: itemId로 매칭되는 것만 조회하고, 없을 때만(fallback) itemId 없는 구버전
  // 레거시 건을 보던 방식은 틀렸다 — 이 아이템이 "구버전(레거시) 승인 1회 → 이후
  // 아이템 단위(itemId 있음) 재승인 1회 이상" 순서로 넘어온 경우, itemId 매칭
  // 결과가 이미 1건 이상 있어 레거시 건이 통째로 빠지고 Rev 번호(순번)가 잘못
  // 처음부터 다시 세어짐(개정이력이 "0"으로 덮어써진 것처럼 보이던 원인). 두
  // 종류를 항상 합쳐서 시간순으로 나열해야 순번이 실제 개정 횟수와 맞는다.
  try {
    const q = fb.query(fb.collection(fb.db, 'approvals'),
      fb.where('projId', '==', pid), fb.where('type', '==', 'itp'), fb.where('status', '==', 'approved'));
    const snap = await fb.getDocs(q);
    rows = snap.docs.map(d => d.data())
      .filter(d => !d.itemId || d.itemId === itemId) // 이 아이템 전용 건 + itemId 없는 레거시(프로젝트 전체) 건
      .sort((a,b) => (a.decidedAt||0) - (b.decidedAt||0));
  } catch(e) { console.error('[ITP 갑지 개정이력 조회]', e); }
  _coverHistoryCache[key] = rows;
  render();
}
function _fetchCoverUsersMap() {
  if (_coverUsersMap !== null) return;
  _coverUsersMap = {};
  if (!window.fb || !fb.db) return;
  fb.getDocs(fb.collection(fb.db, 'users')).then(snap => {
    const map = {};
    snap.docs.forEach(d => { const u = d.data(); map[d.id] = u.name || d.id; });
    _coverUsersMap = map;
    render();
  }).catch(e => console.warn('[ITP 갑지] 사용자 목록 조회 실패:', e.message));
}
// v3.5: 표지 우측 상단 "최종 결재" 도장 표 — 결재 상세(index.html)·교정
// 견적의뢰서(measurement-tools.html)와 동일한 모양으로 플랫폼 전체 통일.
function _itpApprStampBoxHtml(line, nameOf, fmtDate) {
  if (!Array.isArray(line) || !line.length) return '';
  const cells = line.map(s => {
    let stampHtml;
    if (s.status === 'approved')      stampHtml = `<div style="border:1.5px solid #2E7D32;color:#2E7D32;border-radius:50%;width:30px;height:30px;line-height:30px;margin:2px auto;font-size:10px;">승인</div>`;
    else if (s.status === 'rejected') stampHtml = `<div style="border:1.5px solid #C62828;color:#C62828;border-radius:50%;width:30px;height:30px;line-height:30px;margin:2px auto;font-size:10px;">반려</div>`;
    else if (s.status === 'skipped')  stampHtml = `<div style="color:#999;font-size:9px;padding:10px 0;">전결<br>생략</div>`;
    else if (s.status === 'pending')  stampHtml = `<div style="color:#E65100;font-size:10px;padding:10px 0;">대기중</div>`;
    else                              stampHtml = `<div style="color:#999;font-size:10px;padding:10px 0;">예정</div>`;
    return { role: s.role, name: nameOf(s.uid), stampHtml, dt: s.decidedAt ? fmtDate(s.decidedAt) : '' };
  });
  const bd = 'border:0.5px solid #999;';
  return `<table style="border-collapse:collapse;font-size:10px;text-align:center;">
    <tr><td rowspan="4" style="${bd}padding:4px;color:#666;background:#f5f5f5;writing-mode:vertical-rl;">결재</td>
      ${cells.map(c=>`<td style="${bd}padding:2px 6px;color:#666;">${esc(c.role)}</td>`).join('')}</tr>
    <tr>${cells.map(c=>`<td style="${bd}padding:2px 6px;">${esc(c.name)}</td>`).join('')}</tr>
    <tr>${cells.map(c=>`<td style="${bd}height:36px;width:48px;">${c.stampHtml}</td>`).join('')}</tr>
    <tr>${cells.map(c=>`<td style="${bd}font-size:9px;color:#999;padding:2px;">${c.dt||'-'}</td>`).join('')}</tr>
  </table>`;
}
function renderItpCoverHtml(doc, it) {
  _fetchItpCoverHistory(doc.pid, it.id);
  _fetchCoverUsersMap();
  let history = _coverHistoryCache[doc.pid + '__' + it.id];
  const usersMap = _coverUsersMap || {};
  const proj = doc.proj || {};
  const nameOf = uid => (uid && usersMap[uid]) || uid || '';
  const roleName = (line, role) => { const s = (Array.isArray(line)?line:[]).find(x => x.role === role); return s ? nameOf(s.uid) : ''; };
  const fmtDate = ts => { if (!ts) return ''; const d = new Date(ts); return String(d.getFullYear()).slice(2) + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0'); };
  const itemLabel = esc([it.name, it.tag].filter(Boolean).join(' / '));
  const TH = 'border:1px solid #000;padding:5px 4px;font-size:10px;font-weight:700;text-align:center;vertical-align:middle;';

  const fld = 'font-size:18px;font-weight:700;text-decoration:underline;display:inline-block;min-width:150px;';
  // v2.8: approvals 컬렉션 조회 결과가 비어 있어도(예: itemId 필드가 없던 구버전 프로젝트 단위
  // 승인 건), 이 아이템이 실제로는 승인된 상태(getItemApproval)라면 그 정보만으로라도
  // 최소 1행(Rev 0)을 만들어 보여준다 — "승인 완료"인데 "이력 없음"이라 나오는 모순 방지.
  if (history !== null && history.length === 0) {
    const ia = getItemApproval(doc, it.id);
    if (ia && ia.status === 'approved') {
      history = [{ decidedAt: Number(ia.approvedAt) || null, approvalLine: [{ role: '승인', uid: ia.approvedBy }], _legacyFallback: true }];
    }
  }
  const rowsHtml = history === null
    ? `<tr><td colspan="6" style="${TD}color:#999;">개정 이력 조회 중...</td></tr>`
    : (history.length === 0
      ? `<tr><td colspan="6" style="${TD}color:#999;">승인 이력 없음(최초 발행 전)</td></tr>`
      : history.map((h,i) => `<tr>
          <td style="${TD}font-weight:700;">${i}</td>
          <td style="${TD}">${fmtDate(h.decidedAt)}</td>
          <td style="${TD}">${esc(roleName(h.approvalLine, '작성'))}</td>
          <td style="${TD}">${esc(roleName(h.approvalLine, '검토'))}</td>
          <td style="${TD}">${esc(roleName(h.approvalLine, '승인'))}</td>
          <td style="${TD}"></td>
        </tr>`).join(''));
  const latestLine = (history && history.length) ? history[history.length-1].approvalLine : null;
  const stampHtml = _itpApprStampBoxHtml(latestLine, nameOf, fmtDate);
  return `
    <div class="itp-cover" style="font-family:Arial,sans-serif;font-size:15px;border:1.5px solid #000;padding:26px 30px;box-sizing:border-box;page-break-after:always;position:relative;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <img src="${ITP_LOGO}" alt="㈜세종기술" style="max-width:96px;max-height:50px;object-fit:contain;flex-shrink:0;">
          <div style="font-size:8.5px;line-height:1.5;color:#222;white-space:nowrap;"><div style="font-weight:700;font-size:10px;">㈜세종기술</div><div>Sejong Tech Co., Ltd.</div></div>
        </div>
        ${stampHtml || '<div></div>'}
      </div>
      <div style="text-align:center;margin:16px 0 30px;">
        <span style="font-size:30px;font-weight:700;text-decoration:underline;">Inspection And Test Plan</span>
      </div>
      <div style="line-height:2.7;margin-bottom:44px;">
        <div><span style="${fld}">Project Name :</span> &nbsp;${esc(proj.name||'')}</div>
        <div><span style="${fld}">Client :</span> &nbsp;${esc(proj.customer||'')}</div>
        <div><span style="${fld}">Manufacturer :</span> &nbsp;SEJONG TECH CO., LTD.</div>
        <div><span style="${fld}">JOB No. :</span> &nbsp;${esc(proj.no||'')}</div>
        <div><span style="${fld}">Item / Tag No. :</span> &nbsp;${itemLabel}</div>
      </div>
      <div class="itp-cover-revwrap">
        <table style="width:100%;border-collapse:collapse;">
          <colgroup><col style="width:8%"><col style="width:15%"><col style="width:19%"><col style="width:19%"><col style="width:19%"><col style="width:20%"></colgroup>
          <thead>
            <tr>
              <th style="${TH}" rowspan="2">Rev. No.</th>
              <th style="${TH}" rowspan="2">Date</th>
              <th style="${TH}" colspan="3">Sejong Tech</th>
              <th style="${TH}">Client</th>
            </tr>
            <tr>
              <th style="${TH}">Prepared by</th>
              <th style="${TH}">Checked by</th>
              <th style="${TH}">Approved by</th>
              <th style="${TH}">Approved by</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

  const hProjName = hdr.projName || proj.name || lbl.name || "";
  const hJobNo    = hdr.jobNo    || proj.no   || lbl.code || "";
  const hItemLbl  = hdr.itemLabel || `${it.name||it.tag||""} / ${it.tag||""}`;
  const hCustomer = hdr.customer || proj.customer || lbl.client || "";

  // 검사표 행 (SJ/QC/Client 입회 표시)
  const bodyRows = rows.map((r, i) => {
    const w = r.witness || {};
    return `<tr${r.specOnly ? ' style="background:#fffbe5;"' : ''}>
      <td class="ish-no">${i+1}</td>
      <td class="ish-l">${esc(r.activity || r.act || r.item || '')}</td>

      <td class="ish-c">${esc(w.client || '')}</td>
      <td class="ish-l ish-sm">${esc(r.remarks || r.remark || '')}</td>
    </tr>`;
  }).join('');

  return `
    <div class="breadcrumb">
      <a onclick="state.selectedPid=null;state.selectedItem=null;render();scrollToTop()">${LI('library','📚')} ITP 조회</a><span class="sep">›</span>
      <a onclick="goBack()">${esc(lbl.code)}</a><span class="sep">›</span>
      <b>${esc(it.name || it.tag || '아이템 #'+(state.selectedItem+1))}</b>
    </div>
    <div class="hd no-print">
      <div><div class="sub">아래는 ITP Builder에서 승인·저장된 원본 그대로입니다. (읽기 전용)</div></div>

        <button class="btn" onclick="goBack()">← 아이템 목록</button>

  `;
}

function render() {
  const app = document.getElementById('app');
  if (state.selectedPid && state.selectedItem != null) app.innerHTML = renderItem();
  else if (state.selectedPid) app.innerHTML = renderProj();
  else app.innerHTML = renderList();
}

// v1.2: 아이템 단위 삭제 — 프로젝트 ITP에서 선택한 아이템 하나만 제거 (전체 삭제 아님).
// Firestore 최신 문서를 다시 읽어 해당 아이템만 items 배열에서 빼고 저장(merge).
// id 매칭을 우선, 없으면 인덱스로 폴백. 마지막 1개를 지우면 프로젝트가 목록에서 사라짐(items 0).
async function deleteItpItem(pid, itemId, idx, label){
  if(!fb.auth || !fb.auth.currentUser){ alert('로그인 후 삭제할 수 있습니다.'); return; }
  if(!confirm(`"${label}" 아이템 1개를 이 ITP에서 삭제합니다.\n\n· 이 아이템의 검사항목만 지워집니다 (다른 아이템은 유지)\n· 되돌릴 수 없습니다\n\n계속할까요?`)) return;
  try{
    // v2.0: 라이브 문서 + 승인본 스냅샷 양쪽에서 삭제 (조회는 스냅샷을 보므로 둘 다 반영해야 함)
    const rmFrom = async (coll) => {
      const snap = await fb.getDoc(fb.doc(fb.db, coll, pid));
      if(!snap.exists()) return null;
      const d = snap.data();
      const items = Array.isArray(d.items) ? d.items.slice() : [];
      let rm = itemId ? items.findIndex(x => x && x.id === itemId) : -1;
      if(rm < 0) rm = idx;
      if(rm < 0 || rm >= items.length) return null;
      items.splice(rm, 1);
      await fb.setDoc(fb.doc(fb.db, coll, pid), { items, savedAt: Date.now() }, { merge: true });
      return items;
    };
    const liveItems = await rmFrom('t_itpBuilderDocs');
    const snapItems = await rmFrom('t_itpApproved');
    const items = snapItems || liveItems;
    if(items === null){ alert('삭제할 아이템을 찾지 못했습니다. 새로고침 후 다시 시도해주세요.'); return; }
    // 로컬 상태 즉시 반영 (onSnapshot이 곧 덮어쓰지만 UX상 바로 갱신)
    const localDoc = state.itpDocs.find(x => x.pid === pid);
    if(localDoc) localDoc.items = items;
    state.selectedItem = null;
    if(!items.length){ state.selectedPid = null; }   // 다 지웠으면 목록으로
    render(); scrollToTop();
    alert('✅ 아이템을 삭제했습니다.' + (items.length ? '' : ' (남은 아이템이 없어 목록으로 돌아갑니다)'));
  }catch(e){ alert('삭제 실패: ' + (e.message||e)); }
}

window.goProj = goProj;
window.goItem = goItem;
window.goBack = goBack;
window.openBuilder = openBuilder;
window.deleteItpItem = deleteItpItem;
window.state = state;
window.render = render;
window.scrollToTop = scrollToTop;

// 이모지 → Lucide 아이콘 자동 변환 (index.html과 동일 패턴)
(function () {
  var scheduled = false;
  function run() {
    scheduled = false;
    if (!window.lucide) return;
    if (!document.querySelector('i[data-lucide]:not(:has(svg))')) return;
    try { lucide.createIcons(); } catch (e) {}
  }
  function schedule() { if (scheduled) return; scheduled = true; queueMicrotask(run); }
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
  window.addEventListener('load', run);
})();

startSync();
</script>
