<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>SJ 메신저</title>

<!-- ══ PWA (W1) — 폰 홈 화면에 설치하고, 끊겨도 다시 열리게 ══
     아이콘은 icons/make-icons.py 로 다시 뽑는다. 파일을 고치면 sw.js 의 버전 문자열을 올릴 것. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SJ메신저">
<meta name="mobile-web-app-capable" content="yes">

<!-- 폰트는 기기 것(카톡과 같다). 웹폰트는 현장 4G 첫 로딩과 오프라인 첫 설치에 짐이라 뺐다. -->

<!-- ══ W2 — 껍데기만. 화면·데이터는 messenger.js(ES 모듈), 모양은 messenger.css.
     ?v= 는 index.html 의 MESSENGER_BUILD 와 같은 값으로 올린다(둘이 어긋나면 옛 JS 가 10분 캐시된다). -->
<link rel="stylesheet" href="./messenger.css?v=b117">

<script>
  // 모듈 로드가 실패하면(망·문법 오류) 빈 화면이 아니라 이유가 보이게. 모듈이 뜨면 자기 오류 화면으로 바꾼다.
  window.__sjmFatal = function (msg, detail) {
    document.body.innerHTML = '<div style="padding:20px;color:#b91c1c;font-size:14px;background:#fef2f2;min-height:100vh;font-family:sans-serif">'
      + '<b>메신저를 여는 중 문제가 생겼습니다.</b><br><br>' + String(msg || '')
      + (detail ? '<pre style="white-space:pre-wrap;font-size:12px;color:#7f1d1d;margin-top:12px">' + String(detail) + '</pre>' : '')
      + '<br><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#b91c1c;color:#fff;font-size:14px">다시 열기</button></div>';
  };
  window.onerror = function (msg, url, line, col, err) {
    window.__sjmFatal(msg, (url ? url.split('/').pop() + ':' + line : '') + (err && err.stack ? '\n' + err.stack : ''));
  };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason; window.__sjmFatal('비동기 오류', r && (r.stack || r.message) || String(r));
  });

  // 서비스워커는 앱 코드와 무관하게 먼저 등록한다 — 앱이 죽어도 다음 열림(오프라인)은 살아야 하니까.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(function (e) { console.warn('[PWA] 서비스워커 등록 실패(무시 가능):', e && e.message); });
  }
</script>
</head>
<body>
<div id="app" aria-live="polite"></div>

<!-- 그룹 만들기·초대용 모달 (옛 클래스 유지 — openModal/closeModal 이 이 id 들을 쓴다) -->
<div class="overlay" id="modal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head"><span id="mTitle"></span><button class="sjm-icon-btn" data-act="modal-close" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot"><button class="btn" data-act="modal-close">취소</button><button class="btn btn-primary" id="mOk">확인</button></div>
  </div>
</div>

<div id="sheet" class="sjm-sheet" role="dialog"></div>
<div class="sjm-sheet-scrim" data-act="sheet-close"></div>
<div id="viewer" class="sjm-viewer" role="dialog" aria-label="사진 보기"></div>
<div id="toast" class="sjm-toast" role="status"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="photoCamera" accept="image/*" capture="user" hidden>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="albumInput" accept="image/*,video/*" multiple hidden>

<script type="module" src="./messenger.js?v=b117" onerror="window.__sjmFatal('메신저 코드(messenger.js)를 받지 못했습니다. 인터넷 연결을 확인해 주세요.')"></script>
</body>
</html>
