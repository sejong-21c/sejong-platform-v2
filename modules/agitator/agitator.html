<script>
/* ================================================================
   교반기 선정·설계 모듈
   계산 엔진은 ../../tools/agitcalc/web/agitcalc-core.js (파이썬 패키지 agitcalc 의 1:1 포팅).
   엔진 수식은 이 파일에서 고치지 말고 원본 저장소에서 고친 뒤 재배포한다.
   ================================================================ */

/* --- 메인 앱과 공유하는 사용자 상태 --- */
const KEY = 'SJ_FLOW_V04';
const MODULE_KEY = 'AGITATOR_V01';
const FS_COLL = 't_agitatorDesigns';   // 신규 컬렉션은 t_ 접두사 필수

let state = {};
let designs = [];        // 저장된 선정안
let lastSynced = [];
let view = { tab: 'design', result: null, error: null, selectedId: null };

function loadPlatformState() {
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
  if (!state.users) state.users = [];
}
function currentUser() {
  const uid = state.currentUser;
  if (!uid) return null;
  return (state.users || []).find(u => u.id === uid) || null;
}
function currentUserName() { const u = currentUser(); return u ? u.name : ''; }
function canEdit() {
  const u = currentUser();
  return !!u && (u.dept === '기술부' || u.grade === 'super' || u.grade === 'exec');
}
function uid() { return 'ag-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function nowISO() { return new Date().toISOString(); }

function loadLocalCache() {
  try { designs = JSON.parse(localStorage.getItem(MODULE_KEY) || '[]'); } catch (e) { designs = []; }
  if (!Array.isArray(designs)) designs = [];
}
function saveLocalCache() {
  try { localStorage.setItem(MODULE_KEY, JSON.stringify(designs)); } catch (e) {}
}

/* --- Firestore 동기화 --- */
async function waitForFbAuth(timeoutMs = 5000) {
  const start = Date.now();
  while (!window.fb || !fb.db || !fb.auth || !fb.auth.currentUser) {
    if (Date.now() - start > timeoutMs)
      throw new Error('로그인 세션을 확인할 수 없습니다 (오프라인이거나 로그인 전일 수 있음)');
    await new Promise(r => setTimeout(r, 200));
  }
}
function mergeServerSnapshot(localArr, serverDocs, prevSynced) {
  const serverIds = new Set(serverDocs.map(d => d.id));
  const prevIds = new Set((prevSynced || []).map(d => d.id));
  const notYetSynced = (localArr || []).filter(n => !serverIds.has(n.id) && !prevIds.has(n.id));
  return [...serverDocs, ...notYetSynced];
}
function startFirestoreSync() {
  if (!window.fb || !fb.db) { setTimeout(startFirestoreSync, 300); return; }
  if (!fb.auth || !fb.auth.currentUser) { setTimeout(startFirestoreSync, 400); return; }
  try {
    fb.onSnapshot(fb.collection(fb.db, FS_COLL), snap => {
      const serverDocs = [];
      snap.forEach(d => serverDocs.push(Object.assign({ id: d.id }, d.data())));
      designs = mergeServerSnapshot(designs, serverDocs, lastSynced);
      lastSynced = serverDocs.map(d => Object.assign({}, d));
      saveLocalCache();
      if (view.tab === 'saved') render();
    }, err => console.warn('[agitator] onSnapshot 실패', err));
  } catch (e) { console.warn('[agitator] sync 실패', e); }
}
async function pushDesign(d) {
  await waitForFbAuth();
  await fb.setDoc(fb.doc(fb.db, FS_COLL, d.id), d);
}
async function removeDesign(id) {
  await waitForFbAuth();
  await fb.deleteDoc(fb.doc(fb.db, FS_COLL, id));
}

/* --- 입력 기본값 --- */
const DEFAULTS = {
  project: '', item: '', customer: '',
  T: 4500, V: 50, rho: 1300, mu: 15000,
  impellerType: '', dT: '', nImp: '',
  basis: 'level', level: 'moderate', rpm: '', blendMin: '',
  material: 'SUS304', mechEff: 0.95, motorMargin: 1.15, maxLoad: 0.90,
  shaftExtra: 600, serviceFactor: 1.5, baffled: '', dataset: 'LIT',
  vfdMin: 0.3
};
let form = Object.assign({}, DEFAULTS);

const LEVEL_LABEL = {
  mild: '완만 (20~100 W/m³) — 액위 균일화',
  moderate: '보통 (100~300 W/m³) — 일반 혼합·열전달',
  vigorous: '강 (300~800 W/m³) — 고체현탁·반응',
  intense: '격렬 (800~2000 W/m³) — 유화·결정화'
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function n2(x, d) { return (x == null || !isFinite(x)) ? '—' : Number(x).toFixed(d == null ? 2 : d); }
function LI(li, emoji) { return li ? `<i data-lucide="${li}">${emoji || ''}</i>` : (emoji || ''); }

/* ================================================================
   계산 실행
   ================================================================ */
function runDesign() {
  view.error = null;
  const f = form;
  const num = v => (v === '' || v == null) ? null : Number(v);
    const mm = v => { const x = num(v); return x == null ? null : x / 1000; };   // mm 입력 -> m
  try {
    const opts = {
      V: Number(f.V), rho: Number(f.rho), mu_cP: Number(f.mu),
      T: mm(f.T), basis: f.basis, level: f.level,
      impellerType: f.impellerType || null,
      dT: num(f.dT), nImp: num(f.nImp),
      rpm: num(f.rpm), targetBlendMin: num(f.blendMin),
      material: f.material, mechEff: Number(f.mechEff),
      motorMargin: Number(f.motorMargin), maxLoad: Number(f.maxLoad),
      shaftExtraMM: Number(f.shaftExtra), serviceFactor: Number(f.serviceFactor),
      vfdMinRpmRatio: Number(f.vfdMin), dataset: f.dataset,
      baffled: f.baffled === '' ? null : (f.baffled === 'yes')
    };
    if (!(opts.V > 0)) throw new Error('액체 체적 V 를 입력하세요');
    if (!(opts.rho > 0)) throw new Error('밀도(비중) 를 입력하세요');
    if (!(opts.mu_cP > 0)) throw new Error('점도 를 입력하세요');
    view.result = agitcalc.design(opts);
  } catch (e) {
    view.error = e.message || String(e);
    view.result = null;
  }
  render();
}

/* ================================================================
   탱크 단면도 SVG
   ================================================================ */
function drawTank(res) {
  const g = res.geometry;
  const W = 620, Hpx = 490;
  // mT 는 구동부 박스(yTop-62)와 T 치수선(yTop-18)이 들어갈 만큼 확보해야 한다.
  // 탱크가 높아 yTop 이 mT 까지 올라가면 mT<62 에서 구동부가 캔버스 밖으로 나간다.
  const mL = 96, mR = 150, mT = 78, mB = 46;
  const drawW = W - mL - mR, drawH = Hpx - mT - mB;

  // 탱크 전체 높이 = 액위 + 여유공간(액위의 20%) 로 스케일
  const tankH = g.H * 1.2;
  const sc = Math.min(drawW / g.T, drawH / tankH);
  const tw = g.T * sc, th = tankH * sc;
  const cx = mL + drawW / 2;
  const yTop = mT + (drawH - th);
  const yBot = yTop + th;
  const xL = cx - tw / 2, xR = cx + tw / 2;
  const yLiq = yBot - g.H * sc;
  const dishR = tw * 0.25;

  const P = [];
  // 그라디언트·그림자 정의 (임펠러·축 금속 질감)
  P.push(`<defs>
    <linearGradient id="impG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE0B2"/><stop offset="0.45" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#EF6C00"/>
    </linearGradient>
    <linearGradient id="stlG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78909C"/><stop offset="0.5" stop-color="#ECEFF1"/>
      <stop offset="1" stop-color="#607D8B"/>
    </linearGradient>
    <filter id="impSh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#5D2E00" flood-opacity="0.35"/>
    </filter>
  </defs>`);
  // 탱크 셸 (하부 접시경판)
  P.push(`<path d="M ${xL} ${yTop} L ${xL} ${yBot - dishR}
      Q ${xL} ${yBot} ${cx} ${yBot} Q ${xR} ${yBot} ${xR} ${yBot - dishR}
      L ${xR} ${yTop}" fill="#fff" stroke="#37474F" stroke-width="2.5"/>`);
  // 액체
  P.push(`<path d="M ${xL} ${yLiq} L ${xL} ${yBot - dishR}
      Q ${xL} ${yBot} ${cx} ${yBot} Q ${xR} ${yBot} ${xR} ${yBot - dishR}
      L ${xR} ${yLiq} Z" fill="#BBDEFB" fill-opacity="0.55" stroke="none"/>`);
  P.push(`<line x1="${xL}" y1="${yLiq}" x2="${xR}" y2="${yLiq}" stroke="#1976D2" stroke-width="1.6" stroke-dasharray="7 4"/>`);

  // 배플
  if (g.baffled) {
    const bw = g.B * sc, bg = g.B_wall_clearance * sc;
    [-1, 1].forEach(s => {
      const x = s < 0 ? xL + bg : xR - bg - bw;
      P.push(`<rect x="${x}" y="${yLiq + 4}" width="${Math.max(bw, 2.5)}" height="${(yBot - dishR) - yLiq - 6}" fill="#90A4AE" stroke="#546E7A" stroke-width="0.8"/>`);
    });
  }

  // 축
  const shaftW = Math.max(res.shaft_dia_mm / 1000 * sc, 4);
  P.push(`<rect x="${cx - shaftW / 2}" y="${yTop - 30}" width="${shaftW}" height="${(yBot - g.elevations[0] * sc) - (yTop - 30) + 6}" fill="url(#stlG)" stroke="#455A64" stroke-width="1"/>`);
  // 구동부
  P.push(`<rect x="${cx - 34}" y="${yTop - 62}" width="68" height="32" rx="4" fill="#455A64"/>`);
  P.push(`<text x="${cx}" y="${yTop - 42}" font-size="11" fill="#fff" text-anchor="middle" font-family="sans-serif">${n2(res.motor_kW, 1)} kW</text>`);
  // 플랜지(노즐)
  P.push(`<rect x="${cx - 30}" y="${yTop - 8}" width="60" height="8" fill="#607D8B"/>`);

  // 임펠러 (형식별 벡터 렌더 — 그라디언트·허브·그림자)
  const dw = g.D * sc;
  const IMP = 'url(#impG)', ST = '#E65100';
  const t = g.impeller_type;
  const hub = (yc, h) => `<rect x="${cx - shaftW / 2 - 2.5}" y="${yc - h / 2}" width="${shaftW + 5}" height="${h}" rx="2.5" fill="url(#stlG)" stroke="#455A64" stroke-width="0.9"/>`;
  g.elevations.forEach(e => {
    const y = yBot - e * sc;
    const x0 = cx - dw / 2;
    if (t === 'MAXBLEND') {
      const lp = (g.lower_paddle_H || g.H * 0.35) * sc;
      const gr = (g.grid_H || g.H * 0.5) * sc;
      // 상부 격자 프레임 + 격자살
      P.push(`<rect x="${x0}" y="${y - lp - gr}" width="${dw}" height="${gr}" rx="5" fill="#FFF3E0" fill-opacity="0.45" stroke="${ST}" stroke-width="1.8"/>`);
      for (let i = 1; i <= 3; i++)
        P.push(`<line x1="${x0 + dw * i / 4}" y1="${y - lp - gr + 3}" x2="${x0 + dw * i / 4}" y2="${y - lp - 3}" stroke="${ST}" stroke-width="1.2" stroke-opacity="0.8"/>`);
      for (let j = 1; j <= 2; j++)
        P.push(`<line x1="${x0 + 3}" y1="${y - lp - gr * j / 3}" x2="${x0 + dw - 3}" y2="${y - lp - gr * j / 3}" stroke="${ST}" stroke-width="1.2" stroke-opacity="0.8"/>`);
      // 하부 대형 패들 + 하이라이트
      P.push(`<rect x="${x0}" y="${y - lp}" width="${dw}" height="${lp}" rx="7" fill="${IMP}" stroke="${ST}" stroke-width="1.8" filter="url(#impSh)"/>`);
      P.push(`<rect x="${x0 + 5}" y="${y - lp + 5}" width="${dw - 10}" height="${Math.max(lp * 0.22, 4)}" rx="3" fill="#fff" fill-opacity="0.28"/>`);
      P.push(hub(y - lp - gr / 2, gr + lp));
    } else if (t === 'ANCHOR') {
      const top = y - g.H * sc * 0.72, arm = Math.max(shaftW * 0.7, 5);
      const botC = Math.min(y + dw * 0.12, yBot - 3);   // 바닥 곡선이 접시경판 밖으로 나가지 않게
      const frame = `M ${x0} ${top} L ${x0} ${y} Q ${cx} ${botC} ${cx + dw / 2} ${y} L ${cx + dw / 2} ${top}`;
      P.push(`<path d="${frame}" fill="none" stroke="${IMP}" stroke-width="${arm + 2}" stroke-linecap="round" stroke-linejoin="round" filter="url(#impSh)"/>`);
      P.push(`<path d="${frame}" fill="none" stroke="${ST}" stroke-width="1.1" stroke-opacity="0.7"/>`);
      P.push(`<line x1="${x0}" y1="${top}" x2="${cx + dw / 2}" y2="${top}" stroke="${IMP}" stroke-width="${arm}" stroke-linecap="round"/>`);
      P.push(hub(top, arm * 2.4));
    } else if (t === 'RIBBON') {
      const top = y - g.H * sc * 0.72, R = dw / 2, coils = 3;
      const seg = (y - top) / coils;
      // 두 밴드가 같은 구간[top,y]을 좌우 역위상으로 감아 이중 헬릭스처럼 교차 (바닥 이탈 없음)
      const band = ph => {
        let d = `M ${cx + ph * R} ${top}`;
        for (let i = 0; i < coils; i++) {
          const y0 = top + i * seg;
          d += ` Q ${cx} ${y0 + seg * 0.25} ${cx - ph * R} ${y0 + seg * 0.5} Q ${cx} ${y0 + seg * 0.75} ${cx + ph * R} ${y0 + seg}`;
        }
        return d;
      };
      P.push(`<path d="${band(1)}" fill="none" stroke="${IMP}" stroke-width="4.5" stroke-linecap="round" filter="url(#impSh)"/>`);
      P.push(`<path d="${band(-1)}" fill="none" stroke="#F9A825" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>`);
      P.push(hub(top, Math.max(shaftW * 1.6, 8)));
    } else {
      // 회전날개형 (러시톤·피치블레이드·패들·프로펠러·하이드로포일)
      const bh = Math.max(g.W * sc, 6);
      const tilt = (g.blade_angle_deg && g.blade_angle_deg < 90) ? bh * 0.55 : 0;
      [-1, 1].forEach(s => {
        const xi = cx + s * shaftW / 2, xo = cx + s * dw / 2, dy = s < 0 ? -tilt : tilt;
        P.push(`<polygon points="${xi},${y - bh / 2} ${xo},${y - bh / 2 + dy} ${xo},${y + bh / 2 + dy} ${xi},${y + bh / 2}" fill="${IMP}" stroke="${ST}" stroke-width="1.3" stroke-linejoin="round" filter="url(#impSh)"/>`);
      });
      if (t === 'RUSHTON' && g.disc_D) {
        const ddw = g.disc_D * sc;
        P.push(`<rect x="${cx - ddw / 2}" y="${y - 2.5}" width="${ddw}" height="5" rx="2" fill="url(#stlG)" stroke="#455A64" stroke-width="0.9"/>`);
      }
      P.push(hub(y, bh + 4));
    }
  });

  // 치수선
  const dim = (x1, y1, x2, y2, label, off, vert) => {
    const c = '#1976D2';
    let s = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1"/>`;
    const cap = (x, y) => `<line x1="${vert ? x - 4 : x}" y1="${vert ? y : y - 4}" x2="${vert ? x + 4 : x}" y2="${vert ? y : y + 4}" stroke="${c}" stroke-width="1"/>`;
    s += cap(x1, y1) + cap(x2, y2);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    s += `<text x="${mx + (vert ? -7 : 0)}" y="${my + (vert ? 3 : -5)}" font-size="10.5" fill="${c}"
        text-anchor="${vert ? 'end' : 'middle'}" font-family="sans-serif">${label}</text>`;
    return s;
  };
  // T (상부 가로)
  P.push(dim(xL, yTop - 18, xR, yTop - 18, `T = ${(g.T * 1000).toFixed(0)}`, 0, false));
  // H (좌측 세로)
  P.push(dim(xL - 14, yLiq, xL - 14, yBot, `H = ${(g.H * 1000).toFixed(0)}`, 0, true));
  // D (임펠러 가로)
  const yD = yBot - g.elevations[0] * sc + 26;
  P.push(dim(cx - dw / 2, yD, cx + dw / 2, yD, `D = ${(g.D * 1000).toFixed(0)}`, 0, false));
  // C (바닥간극)
  P.push(dim(xR + 16, yBot - g.elevations[0] * sc, xR + 16, yBot, `C = ${(g.C * 1000).toFixed(0)}`, 0, true));

  // 우측 범례
  const lx = xR + 46;
  const rows = [
    ['형식', g.impeller_type],
    ['D/T', g.D_T.toFixed(3)],
    ['단수', g.n_impellers + ' 단'],
    ['W/D', g.W_D.toFixed(3)],
    ['배플', g.baffled ? g.n_baffles + '매' : '무배플'],
    ['축', 'φ' + res.shaft_dia_mm.toFixed(0)],
    ['rpm', res.rpm],
    ['v_tip', n2(res.v_tip, 2) + ' m/s']
  ];
  rows.forEach((r, i) => {
    const y = yTop + 8 + i * 17;
    P.push(`<text x="${lx}" y="${y}" font-size="10.5" fill="#666" font-family="sans-serif">${esc(r[0])}</text>`);
    P.push(`<text x="${lx + 44}" y="${y}" font-size="10.5" fill="#333" font-weight="600" font-family="sans-serif">${esc(r[1])}</text>`);
  });

  return `<svg class="tankdraw" viewBox="0 0 ${W} ${Hpx}" xmlns="http://www.w3.org/2000/svg">${P.join('')}</svg>`;
}

/* CalcResult 하나를 밝은 HTML 표로. 엔진의 텍스트 report() 대신 쓴다. */
function rptCard(r){
  const rows=[];
  if(r.inputs.length){
    rows.push(`<tr><td class="rpt-sec" colspan="4">입력</td></tr>`);
    r.inputs.forEach(([n,v,u,note])=>rows.push(
      `<tr><td class="k">${esc(n)}</td><td class="v">${esc(agitcalc.fmt(v))}</td>
       <td class="u">${esc(u)}</td><td class="f">${esc(note)}</td></tr>`));
  }
  if(r.steps.length){
    rows.push(`<tr><td class="rpt-sec" colspan="4">계산</td></tr>`);
    r.steps.forEach(([n,f,v,u])=>rows.push(
      `<tr><td class="k">${esc(n)}</td><td class="v">${esc(agitcalc.fmt(v))}</td>
       <td class="u">${esc(u)}</td><td class="f">${esc(f)}</td></tr>`));
  }
  let extra='';
  if(r.checks.length){
    extra+=`<div class="rpt-sec">검토</div><div style="padding:8px 12px">`+
      r.checks.map(([d,p,note])=>`<div class="chk ${p?'ok':'ng'}">${p?'✔':'✘'} ${esc(d)}${
        note?` <span style="opacity:.75">— ${esc(note)}</span>`:''}</div>`).join('')+`</div>`;
  }
  if(r.warnings.length){
    extra+=`<div class="rpt-sec">경고</div><div style="padding:8px 12px">`+
      r.warnings.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')+`</div>`;
  }
  return `<div class="rpt"><div class="rpt-h">${esc(r.title)}${
    r.ref?`<div class="ref">근거: ${esc(r.ref)}</div>`:''}</div>
    <table class="rt">${rows.join('')}</table>${extra}</div>`;
}

/* 형상 치수는 표가 더 읽기 좋아서 별도 표로 낸다 */
function geoCard(g){
  const mm=x=>(x*1000).toFixed(0);
  const row=(k,v,u)=>`<tr><td class="k">${esc(k)}</td><td class="v">${esc(v)}</td><td class="u">${esc(u||'')}</td><td class="f"></td></tr>`;
  const rows=[
    `<tr><td class="rpt-sec" colspan="4">탱크</td></tr>`,
    row('탱크 내경 T',mm(g.T),'mm'), row('액위 H',mm(g.H)+`  (H/T=${g.H_T.toFixed(3)})`,'mm'),
    row('액체 체적 V',g.V.toFixed(3),'m³'),
    `<tr><td class="rpt-sec" colspan="4">임펠러</td></tr>`,
    row('형식',g.impeller_type+' × '+g.n_impellers+'단',''),
    row('임펠러경 D',mm(g.D)+`  (D/T=${g.D_T.toFixed(3)})`,'mm'),
    row('날개폭 W',mm(g.W)+`  (W/D=${g.W_D.toFixed(3)})`,'mm'),
    row('바닥간극 C',mm(g.C)+`  (C/T=${g.C_T.toFixed(3)})`,'mm'),
    ...g.elevations.map((e,i)=>row(`${i+1}단 설치높이 (바닥에서)`,mm(e),'mm')),
    ...(g.spacing?[row('임펠러 간격 S',mm(g.spacing)+`  (S/D=${g.spacing_over_D.toFixed(2)})`,'mm')]:[]),
    ...(g.n_blades?[row('날개 수',g.n_blades,'매')]:[]),
    ...(g.blade_angle_deg?[row('날개 각도',g.blade_angle_deg,'deg')]:[]),
    ...(g.blade_thk?[row('날개 두께',mm(g.blade_thk),'mm')]:[]),
    ...(g.lower_paddle_H?[row('하부 패들 높이',mm(g.lower_paddle_H),'mm')]:[]),
    ...(g.grid_H?[row('상부 격자 높이',mm(g.grid_H),'mm')]:[]),
    ...(g.wall_clearance?[row('벽 간극',mm(g.wall_clearance),'mm')]:[]),
    `<tr><td class="rpt-sec" colspan="4">배플</td></tr>`,
    g.baffled?row('배플',`${g.n_baffles}매 × ${mm(g.B)} (벽간극 ${mm(g.B_wall_clearance)})`,'mm')
             :row('배플','무배플 — 광폭/근접간극 임펠러로 선회류 억제',''),
    row('권장 익단속도',`${g.tip_speed_range[0].toFixed(1)} ~ ${g.tip_speed_range[1].toFixed(1)}`,'m/s')
  ];
  return `<div class="rpt"><div class="rpt-h">임펠러·탱크 형상 치수 — ${esc(g.impeller_name)} (${esc(g.flow)})
    <div class="ref">${esc(g.reason)}</div></div><table class="rt">${rows.join('')}</table></div>`;
}

function runVendor() {
  try {
    const imps = vform.imps.filter(p => p[0] && Number(p[1]) > 0).map(p => [p[0], Number(p[1]) / 1000]);
    if (!imps.length) throw new Error('임펠러를 1개 이상 입력하세요');
    const r = agitcalc.topjinSheet({
      T: Number(vform.T) / 1000, V: Number(vform.V), rho: Number(vform.rho),
      mu_cP: Number(vform.mu), rpm: Number(vform.rpm), imps,
      mechEff: Number(vform.mechEff), motor_kW: Number(vform.motor) || null,
      hasCoil: !!vform.hasCoil, baffled: vform.baffled === 'yes'
    });
    const rows = [
      ['Reynolds수', vform.pRe, r.results.Re, ''],
      ['TIP SPEED', vform.pTP, r.results.TP, 'm/s'],
      ['토출유량수 Q/V', vform.pQV, r.results.QV, '回/min'],
      ['계산동력', vform.pPcalc, r.results.P_calc_kW, 'kW'],
      ['보정동력', vform.pPcorr, r.results.P_corr_kW, 'kW'],
      ['부하율', vform.pLoad, r.results.load_pct, '%']
    ];
    const body = rows.map(([label, want, got, unit]) => {
      const w = Number(want);
      if (!isFinite(w) || w === 0) return '';
      const err = Math.abs(got - w) / Math.abs(w) * 100;
      const cls = err <= 0.1 ? 'green' : (err <= 20 ? 'orange' : 'red');
      const tag = err <= 0.1 ? '일치' : (err <= 20 ? '차이' : '큰 차이');
      return `<tr><td>${esc(label)}</td><td class="num">${n2(w, 4)}</td>
        <td class="num">${n2(got, 4)}</td><td class="num">${n2(err, 2)}%</td>
        <td><span class="b-pill ${cls}">${tag}</span></td><td>${esc(unit)}</td></tr>`;
    }).join('');

    // 유체역학적 혼합시간을 별도 산출 (검토서 '교반소요시간' 과 비교용)
    const N = Number(vform.rpm) / 60;
    const D = imps[0][1];
    const T = Number(vform.T) / 1000, V = Number(vform.V);
    const H = agitcalc.liquidHeight(T, V);
    const key = agitcalc.VENDOR_ALIAS[imps[0][0].toUpperCase()] || imps[0][0].toUpperCase();
    const pn = agitcalc.powerNumber(r.results.Re, key, { baffled: r.results.baffled });
    const bt = agitcalc.blendTime(N, D, T, H, pn.Np, r.results.Re, key);

    vresult = `
    <div class="card">
      <h3>${LI('git-compare')} 대조 결과</h3>
      <table class="t">
        <thead><tr><th>항목</th><th>검토서</th><th>agitcalc</th><th>차이</th><th>판정</th><th>단위</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="card">
      <h3>${LI('clock')} 혼합시간 별도 산출</h3>
      <table class="t">
        <tr><td>유체역학적 θ95 (agitcalc)</td><td class="num">${n2(bt.theta / 60, 2)}</td><td>min</td></tr>
        <tr><td>산정근거</td><td colspan="2">${esc(bt.basis)}</td></tr>
      </table>
      <div class="warn" style="margin-top:10px">${LI('alert-triangle')}
        검토서의 '교반소요시간(추정)'은 8건 모두 표준 상관식으로 재현되지 않았습니다
        (t × Q/V 회전수가 88~840회로 30배 흩어짐). 공정 요구시간을 기입한 것으로 추정되므로,
        <b>유체역학적 혼합시간과는 다른 값</b>으로 이해하고 벤더에 정의를 확인하십시오.
      </div>
    </div>
    <div class="card">
      <h3>${LI('list')} 재현 계산 상세</h3>
      ${rptCard(r)}
    </div>`;
  } catch (e) {
    vresult = `<div class="card"><div class="chk ng">${LI('alert-circle')}<div>${esc(e.message || e)}</div></div></div>`;
  }
  render();
}

    특히 <b>Re &lt; 10⁴ (천이·층류)</b> 영역은 문헌 상관식의 오차가 큽니다 (동력 ±15%, 혼합시간 ±50% 이상).
  </div>
  <div class="card">
    <h3>${LI('book-open')} 핵심 계산식</h3>
    <table class="t">
      <thead><tr><th>항목</th><th>식</th><th>근거</th></tr></thead>
      <tbody>
      <tr><td>레이놀즈수</td><td><code>Re = ρ·N·D²/μ</code>  (N [rev/s])</td><td>HIM Ch.6</td></tr>
      <tr><td>프루드수</td><td><code>Fr = N²·D/g</code></td><td>볼텍스 판정</td></tr>
      <tr><td>익단속도</td><td><code>v_tip = π·D·N</code></td><td>전단 지표</td></tr>
      <tr><td>동력수 (2점근)</td><td><code>Np(Re) = max(Kp/Re, Np_turb)</code></td><td>Nagata 1975</td></tr>
      <tr><td>날개폭 보정</td><td><code>×[(W/D)/(W/D)std]^1.25</code></td><td>Perry's Sec.18</td></tr>
      <tr><td>날개수 보정</td><td><code>×(n/n_std)^0.8</code></td><td>Bates 1963</td></tr>
      <tr><td>소요동력</td><td><code>P = Np·ρ·N³·D⁵</code></td><td>HIM Ch.6</td></tr>

      <tr><td>혼합시간 (난류)</td><td><code>N·θ95 = 5.9·Np^(-1/3)·(T/D)²·(H/T)^0.5</code></td><td>Ruszkowski 1994</td></tr>
      <tr><td>혼합시간 (천이)</td><td><code>×(10⁴/Re)^0.5</code> — 근사</td><td>보정, 오차 큼</td></tr>
      <tr><td>임계현탁</td><td><code>N_js = S·ν^0.1·(gΔρ/ρ)^0.45·X^0.13·dp^0.2/D^0.85</code></td><td>Zwietering 1958</td></tr>
      <tr><td>비뉴턴 겉보기점도</td><td><code>γ̇ = ks·N,  μ_app = K·γ̇^(n-1)</code></td><td>Metzner-Otto</td></tr>
      <tr><td>축 허용전단응력</td><td><code>τ_allow = min(0.30Sy, 0.18Su)</code> ×0.75(키홈)</td><td>ASME B106.1M</td></tr>
      <tr><td>축 조합응력</td><td><code>τ_max = √(Mb²+T²)/Zp</code></td><td>최대전단응력설</td></tr>
      <tr><td>축 위험속도</td><td><code>Nc = (1/2π)√(3EI/L³·m_eq)</code>, N/Nc ≤ 0.7</td><td>HIM Ch.21</td></tr>

  </div>
  <div class="card">
    <h3>${LI('table')} 임펠러 데이터베이스</h3>
    <table class="t">
      <thead><tr><th>형식</th><th>유동</th><th>Np_turb</th><th>Kp</th><th>Nq</th><th>D/T</th><th>μ 상한 [cP]</th><th>용도</th></tr></thead>
      <tbody>${Object.values(agitcalc.LIT).map(im => `<tr>
        <td><b>${esc(im.nameKo)}</b></td><td>${esc(im.flow)}</td>
        <td class="num">${im.NpTurb}</td><td class="num">${im.Kp}</td><td class="num">${im.Nq}</td>
        <td class="num">${im.dT[0]}~${im.dT[1]}</td><td class="num">${im.muMax.toLocaleString()}</td>
        <td style="font-size:11.5px">${esc(im.note)}</td></tr>`).join('')}</tbody>

  <div class="card">
    <h3>${LI('search-check')} 협력업체 검토서 역산 결과</h3>
    <p style="font-size:12.5px;line-height:1.7;margin:0 0 10px">
      D&K켐텍 YDK-II 선정검토서 R5 (2025-01-06) 8건을 역산해 확정한 값입니다.
      토출유량수 Nq 는 8/8 케이스에서 상대오차 1e-8 이내로 정확히 재현되었습니다.
    </p>
    <table class="t">
      <thead><tr><th>벤더 형식명</th><th>역산 Nq</th><th>문헌 Nq</th><th>비고</th></tr></thead>
      <tbody>
        <tr><td>MAXBLEND</td><td class="num">0.2100</td><td class="num">0.35</td><td>2건에서 정확히 일치</td></tr>
        <tr><td>2-P.P</td><td class="num">0.5000</td><td class="num">0.40</td><td>4건에서 정확히 일치. 2매가 4매보다 크게 나오는 점 확인 필요</td></tr>
        <tr><td>4-P.P</td><td class="num">0.4095</td><td class="num">0.79</td><td>2건에서 정확히 일치 (0.41 아님)</td></tr>
      </tbody>
    </table>
    <div class="warn" style="margin-top:12px">${LI('alert-triangle')}
      <b>검토서에서 확인된 개선 필요 사항</b><br>
      ① <b>축 강도·위험속도 검토 항목이 없음</b> — 축경이 SJ 모델 표준값으로만 정해져 있고,
      전달토크로 역산한 비틀림응력이 4.6~10.9 MPa 로 흩어져 있습니다.
      MOTOR = V.V.V.F 사양이므로 인버터 전 운전구간의 공진 회피 검토가 특히 필요합니다.<br>
      ② <b>보정계수 근거 미표기</b> — 7건은 1.10, FA-6201 만 1.20 입니다 (유일한 IN-COIL 사양).<br>
      ③ <b>조합형 임펠러의 Np 내부 모순</b> — MAXBLEND+2-P.P 4건에서 Re 가 낮을수록 Np 가
      작아지는 역전이 발생합니다 (Re 174 → 1.40, Re 218/250 → 2.44, Re 224 → 2.05).<br>
      ④ <b>교반소요시간 재현 불가</b> — 표준 상관식과 무관한 값으로 보입니다.

  </div>`;
}

function render() {
  renderTabs();
  const app = document.getElementById('app');
  if (view.tab === 'design') {
    app.innerHTML = `<div class="grid2"><div>${inputForm()}</div><div>${resultPanel()}</div></div>`;
  } else if (view.tab === 'report') {
    app.innerHTML = reportTab();
  } else if (view.tab === 'vendor') {
    app.innerHTML = vendorTab();
  } else if (view.tab === 'saved') {
    app.innerHTML = savedTab();
  } else {
    app.innerHTML = refTab();
  }
  try { lucide.createIcons(); } catch (e) {}
}

/* ---------------- Excel 내려받기 ----------------
   ponytail: HTML 표를 .xls 로 내보낸다 — Excel 이 HTML 테이블을 그대로 열고
   서식(굵기·정렬·테두리)까지 살린다. SheetJS 같은 라이브러리를 넣지 않는 이유.
   진짜 .xlsx(수식·여러 시트·차트)가 필요해지면 그때 SheetJS 를 붙일 것.        */
function downloadXls(){
  const r=view.result, g=r.geometry, s=r.shaft.results, f=form;
  const mm=x=>Math.round(x*1000);
  const H=(t)=>`<tr><td colspan="3" style="background:#D9E7F5;font-weight:bold">${esc(t)}</td></tr>`;
  const R=(k,v,u)=>`<tr><td>${esc(k)}</td><td style="text-align:right">${esc(v)}</td><td>${esc(u||'')}</td></tr>`;
  const rows=[
    H('프로젝트'),
    R('발주처',f.customer||'—'), R('Project',f.project||'—'), R('ITEM NO.',f.item||'—'),
    R('작성일',new Date().toISOString().slice(0,10)), R('작성도구','agitcalc v0.1 (㈜세종기술 기술부)'),
    H('공정 조건'),
    R('액체 체적 V',g.V,'m³'), R('탱크 내경 T',mm(g.T),'mm'), R('액위 H',mm(g.H),'mm'),
    R('H/T',g.H_T.toFixed(3),''), R('비중 ρ',f.rho,'kg/m³'), R('점도 μ',f.mu,'cP'),
    H('임펠러 형상'),
    R('형식',g.impeller_type,''), R('단수',g.n_impellers,'단'),
    R('임펠러경 D',mm(g.D),'mm'), R('D/T',g.D_T.toFixed(3),''),
    R('날개폭 W',mm(g.W),'mm'), R('W/D',g.W_D.toFixed(3),''),
    R('바닥간극 C',mm(g.C),'mm'), R('C/T',g.C_T.toFixed(3),''),
    ...g.elevations.map((e,i)=>R(`${i+1}단 설치높이`,mm(e),'mm')),
    R('배플',g.baffled?`${g.n_baffles}매 × ${mm(g.B)}mm`:'무배플',''),
    H('수력 성능'),
    R('회전수 N',r.rpm,'rpm'), R('Reynolds수 Re',r.Re.toFixed(1),''),
    R('유동영역',agitcalc.flowRegime(r.Re),''), R('동력수 Np',r.Np.toFixed(4),''),
    R('익단속도 v_tip',r.v_tip.toFixed(3),'m/s'), R('Froude수 Fr',r.Fr.toFixed(4),''),
    R('액체전달동력 P',(r.P_liquid/1000).toFixed(3),'kW'), R('단위체적동력 P/V',r.PV.toFixed(1),'W/m³'),
    R('총 토출량 Q',(r.Q_total*60).toFixed(2),'m³/min'), R('탱크 순환시간',r.turnover_s.toFixed(1),'s'),
    R('혼합시간 θ95',(r.theta95_s/60).toFixed(2),'min'),
    H('구동부'),
    R('선정 모터',r.motor_kW,'kW'), R('부하율',r.load_pct.toFixed(1),'%'),
    H('축 검토'),
    R('축경',mm(r.shaft_dia_mm/1000),'mm'), R('축 전장',Math.round(r.shaft_len_mm),'mm'),
    R('설계토크',s.T_design_Nm.toFixed(1),'N·m'), R('비틀림응력 τ',s.tau_MPa.toFixed(2),'MPa'),
    R('굽힘응력 σb',s.sigma_b_MPa.toFixed(2),'MPa'), R('조합응력 τmax',s.tau_max_MPa.toFixed(2),'MPa'),
    R('허용응력 τallow',s.tau_allow_MPa.toFixed(2),'MPa'), R('안전율',s.SF_stress.toFixed(2),''),
    R('최하단 처짐',s.delta_tip_mm.toFixed(3),'mm'), R('1차 위험속도 Nc',s.N_crit_rpm.toFixed(1),'rpm'),
    R('N/Nc',s.N_over_Nc.toFixed(3),''),
    H('검토 결과'),
    ...r.summary.checks.concat(r.shaft.checks).map(([d,p])=>R(d,p?'OK':'NG','')),
    ...(r.summary.warnings.length?[H('경고'),...r.summary.warnings.map((w,i)=>R('경고 '+(i+1),w,''))]:[])
  ];
  const html=`<html><head><meta charset="utf-8"></head><body>
    <table border="1" cellspacing="0" cellpadding="4"
      style="border-collapse:collapse;font-family:'맑은 고딕';font-size:10pt">
      <tr><td colspan="3" style="background:#1976D2;color:#fff;font-size:13pt;font-weight:bold">
        교반기 선정 검토서</td></tr>
      ${rows.join('')}
    </table></body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+html],{type:'application/vnd.ms-excel'}));
  a.download=`교반기선정_${(f.item||'ITEM')}_${new Date().toISOString().slice(0,10)}.xls`;
  a.click();
}

/* ================================================================
   이벤트
   ================================================================ */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { view.tab = tabBtn.dataset.tab; render(); return; }

  if (e.target.closest('#btnCalc')) { runDesign(); return; }
  if (e.target.closest('#btnReset')) { form = Object.assign({}, DEFAULTS); view.result = null; view.error = null; render(); return; }
  if (e.target.closest('#btnVendor')) { runVendor(); return; }
  if (e.target.closest('#btnSheet')) { view.tab = 'report'; render(); return; }

  if (e.target.closest('#btnCopy') && view.result) {
    navigator.clipboard.writeText(agitcalc.fullReport(view.result)).then(
      () => alert('계산서를 클립보드에 복사했습니다.'),
      () => alert('복사에 실패했습니다.'));
    return;
  }
  if (e.target.closest('#btnPrint')) { window.print(); return; }
  if (e.target.closest('#btnXls') && view.result) { downloadXls(); return; }

  if (e.target.closest('#btnSave') && view.result) {
    const r = view.result, g = r.geometry;
    const d = {
      id: uid(), customer: form.customer, project: form.project, item: form.item,
      T: g.T, V: g.V, rho: Number(form.rho), mu: Number(form.mu),
      impellerType: g.impeller_type, D_mm: Math.round(g.D * 1000),
      D_T: g.D_T, n_impellers: g.n_impellers, rpm: r.rpm,
      Re: r.Re, Np: r.Np, v_tip: r.v_tip, P_liquid_kW: r.P_liquid / 1000,
      PV: r.PV, motor_kW: r.motor_kW, load_pct: r.load_pct,
      theta95_min: r.theta95_s / 60, shaft_dia_mm: r.shaft_dia_mm,
      shaft_len_mm: r.shaft_len_mm, N_crit_rpm: r.shaft.results.N_crit_rpm,
      material: form.material, dataset: form.dataset, ok: r.summary.ok,
      inputs: Object.assign({}, form),
      savedBy: currentUserName(), savedAt: nowISO()
    };
    designs.push(d);
    saveLocalCache();
    pushDesign(d).then(() => {
      alert('저장했습니다.');
      view.tab = 'saved'; render();
    }).catch(err => {
      alert('서버 저장에 실패했습니다(로컬에는 저장됨): ' + err.message);
      view.tab = 'saved'; render();
    });
    return;
  }

  const loadBtn = e.target.closest('[data-load]');
  if (loadBtn) {
    const d = designs.find(x => x.id === loadBtn.dataset.load);
    if (d && d.inputs) { form = Object.assign({}, DEFAULTS, d.inputs); view.tab = 'design'; runDesign(); }
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    if (!confirm('이 선정안을 삭제하시겠습니까?')) return;
    const id = delBtn.dataset.del;
    designs = designs.filter(x => x.id !== id);
    saveLocalCache();
    removeDesign(id).catch(err => alert('서버 삭제 실패: ' + err.message)).finally(render);
    return;
  }
});

document.addEventListener('input', e => {
  const f = e.target.dataset.f;
  if (f) { form[f] = e.target.value; return; }
  const v = e.target.dataset.v;
  if (v) { vform[v] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; return; }
  const vi = e.target.dataset.vi;
  if (vi != null) { vform.imps[Number(vi)][0] = e.target.value; return; }
  const vd = e.target.dataset.vd;
  if (vd != null) { vform.imps[Number(vd)][1] = e.target.value; return; }
});

document.addEventListener('change', e => {
  // basis / impellerType 변경은 폼 구조가 바뀌므로 재렌더
  if (e.target.dataset.f === 'basis') { form.basis = e.target.value; render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && view.tab === 'design' && e.target.classList.contains('fi')) {
    runDesign();
  }
});

/* ================================================================
   부트
   ================================================================ */
function boot() {
  loadPlatformState();
  loadLocalCache();
  render();
  startFirestoreSync();
  window.addEventListener('storage', ev => {
    if (ev.key === KEY) { loadPlatformState(); render(); }
  });
  // 아이콘 재렌더는 render() 끝에서 직접 lucide.createIcons() 로 처리한다.
  // MutationObserver 로 body subtree 를 감시하며 createIcons 를 호출하면,
  // createIcons 의 DOM 교체가 옵저버를 다시 깨우는 무한 되먹임이 되어 탭이 얼어붙는다.
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
